  const h = Math.floor(diff / 60);
  if (h < 24) return "Hace " + h + "h";
  const d = Math.floor(h / 24);
  return d === 1 ? "Ayer" : "Hace " + d + " dias";
}

function formatFecha(fechaISO) {
  if (!fechaISO) return "";
  return new Date(fechaISO).toLocaleDateString("es-CL", {day:"2-digit", month:"2-digit", year:"numeric"});
}

function getDiaProspecto(p) {
  const ref = p.fechaUltContacto || p.fecha;
  if (!ref) return 0;
  const horas = (Date.now() - new Date(ref).getTime()) / (1000 * 60 * 60);
  if (horas >= 168) return 7;
  if (horas >= 72) return 3;
  if (horas >= 8) return 1;
  return 0;
}

function getDiaKey(dias) {
  if (dias >= 7) return "d7";
  if (dias >= 3) return "d3";
  if (dias >= 1) return "d1";
  return "hoy";
}

function renderDiaBadge(dias, estado) {
  if (estado === "Cerrado" || estado === "Descartado") return "";
  if (dias === 0) return "<span class=\"p3-dia-badge hoy\">✓ Hoy</span>";
  if (dias >= 7) return "<span class=\"p3-dia-badge d7\">🔴 Dia 7</span>";
  if (dias >= 3) return "<span class=\"p3-dia-badge d3\">🟠 Dia 3</span>";
  if (dias >= 1) return "<span class=\"p3-dia-badge d1\">🟡 Dia 1</span>";
  return "";
}

function renderEstadoBadge(estado) {
  var map = {
    "Nuevo": "<span class=\"p3-estado-badge p3-estado-nuevo\">🟡 Nuevo</span>",
    "Contactado": "<span class=\"p3-estado-badge p3-estado-contactado\">🔵 Contactado</span>",
    "Seguimiento": "<span class=\"p3-estado-badge p3-estado-seguimiento\">🟠 Seguimiento</span>",
    "Cerrado": "<span class=\"p3-estado-badge p3-estado-cerrado\">✓ Cerrado</span>",
    "Descartado": "<span class=\"p3-estado-badge p3-estado-descartado\">✕ Descartado</span>"
  };
  return map[estado] || "<span class=\"p3-estado-badge p3-estado-nuevo\">" + estado + "</span>";
}

function renderMensajesSection(id, dias, estado) {
  if (estado === "Cerrado" || estado === "Descartado") return "";
  var diaKey = getDiaKey(dias);
  if (diaKey === "hoy") diaKey = "d1";
  var mensajes = MENSAJES_PROTOCOLO[diaKey] || [];
  if (!mensajes.length) return "";

  var label = diaKey === "d1" ? "Dia 1 — Primer seguimiento" : diaKey === "d3" ? "Dia 3 — Seguimiento con gancho" : "Dia 7 — Ultimo intento";
  var tabs = mensajes.map(function(m, i) {
    return "<button class=\"p3-msg-tab" + (i === 0 ? " active" : "") + "\" onclick=\"switchMsgTab('" + id + "','" + diaKey + "'," + i + ")\">" + m.label + "</button>";
  }).join("");

  return "<div id=\"pmsg-" + id + "\" class=\"p3-msg-wrap\">" +
    "<div class=\"p3-msg-label\">💬 " + label + "</div>" +
    "<div class=\"p3-msg-tabs\">" + tabs + "</div>" +
    "<div class=\"p3-msg-text\">" + mensajes[0].texto + "</div>" +
    "<button class=\"p3-msg-copy\" onclick=\"copiarMensaje('" + id + "','" + diaKey + "')\">📋 Copiar mensaje</button>" +
    "</div>";
}

function renderHistorial(historial) {
  if (!historial || !historial.length) return "<div style=\"font-size:0.72rem;color:#333;font-style:italic;padding:4px 0\">Sin historial aun</div>";
  return historial.slice().reverse().map(function(h) {
    var esVenta = h.accion === "VENTA CERRADA";
    var esEvo = h.accion === "Agregado a EVO";
    var color = esVenta ? "rgba(29,158,117,0.06)" : esEvo ? "rgba(127,119,221,0.06)" : "transparent";
    return "<div class=\"p3-hist-item\" style=\"background:" + color + ";border-radius:5px;padding:3px 5px\">" +
      "<div class=\"p3-hist-meta\">" +
      "<span class=\"p3-hist-quien\">" + (h.quien || "?") + "</span>" +
      "<span class=\"p3-hist-accion\">" + h.accion + "</span>" +
      "<span class=\"p3-hist-tiempo\">" + tiempoTranscurrido(h.fecha) + "</span>" +
      "</div>" +
      (h.nota ? "<div class=\"p3-hist-nota\">" + h.nota + "</div>" : "") +
      "</div>";
  }).join("");
}

function renderProspCard(p, esAdmin) {
  var archivado = p.estado === "Cerrado" || p.estado === "Descartado";
  var dias = getDiaProspecto(p);
  var diaKey = getDiaKey(dias);
  var urgente = !archivado && dias >= 1;
  var cardClass = "p3-card" + (archivado ? " archivado" : urgente ? (" urgente-" + diaKey) : "");

  var historial = p.historial || [];
  var ultimaNota = historial.length > 0 ? historial[historial.length - 1] : null;
  var ultimaNotaHtml = (ultimaNota && ultimaNota.accion !== "Prospecto creado" && (ultimaNota.nota || ultimaNota.accion)) ?
    "<div class=\"p3-ultima-nota\">💬 " + (ultimaNota.nota || ultimaNota.accion) + "</div>" : "";

  var contactoInfo = [];
  if (p.canal) contactoInfo.push("📱 " + p.canal);
  if (p.telefono) contactoInfo.push("<a href=\"tel:" + p.telefono + "\">📞 " + p.telefono + "</a>");
  if (p.correo) contactoInfo.push("<a href=\"mailto:" + p.correo + "\">✉️ " + p.correo + "</a>");
  if (esAdmin && p.creadoPor) contactoInfo.push("👤 " + p.creadoPor);

  var enEvo = p.enEvo === true || String(p.enEvo).toLowerCase() === "true";
  var evoHtml = enEvo ?
    "<div class=\"p3-btn-evo done\">✅ En EVO</div>" :
    "<button class=\"p3-btn-evo\" onclick=\"marcarEvo('" + p.id + "')\">📋 Agregar a EVO</button>";

  var mensajesHtml = renderMensajesSection(p.id, dias, p.estado);
  var mostrarMsgBtn = mensajesHtml ? "<button class=\"p3-btn p3-btn-msg\" onclick=\"toggleMensajes('" + p.id + "')\">💬 Ver mensaje</button>" : "";

  var accionesHtml = "";
  if (!archivado) {
    accionesHtml = "<div class=\"p3-acciones\">" +
      "<select class=\"p3-btn-estado\" onchange=\"actualizarEstadoProsp('" + p.id + "', this.value)\" title=\"Cambiar estado\">" +
      "<option value=\"\">— Estado —</option>" +
      "<option value=\"Nuevo\"" + (p.estado === "Nuevo" ? " selected" : "") + ">🟡 Nuevo</option>" +
      "<option value=\"Contactado\"" + (p.estado === "Contactado" ? " selected" : "") + ">🔵 Contactado</option>" +
      "<option value=\"Seguimiento\"" + (p.estado === "Seguimiento" ? " selected" : "") + ">🟠 Seguimiento</option>" +
      "</select>" +
      mostrarMsgBtn +
      "<button class=\"p3-btn p3-btn-venta\" onclick=\"togglePlanSelect('" + p.id + "')\">🏆 Cerrar</button>" +
      "<button class=\"p3-btn p3-btn-descartar\" onclick=\"descartarProspecto('" + p.id + "')\">✕</button>" +
      "</div>" +
      "<div class=\"p3-nota-row\">" +
      "<input class=\"p3-nota-input\" id=\"pnota-" + p.id + "\" placeholder=\"Agregar nota...\" type=\"text\">" +
      "<button class=\"p3-nota-save\" onclick=\"agregarNotaProsp('" + p.id + "')\">Guardar</button>" +
      "</div>" +
      mensajesHtml +
      "<div class=\"p3-plan-wrap\" id=\"pplan-" + p.id + "\">" +
      "<select class=\"p3-plan-sel\" id=\"pplansel-" + p.id + "\">" +
      "<option value=\"\">— Plan vendido —</option>" +
      "<option value=\"PAC Mensual\">PAC Mensual $34.990</option>" +
      "<option value=\"PAC Estudiante\">PAC Estudiante $29.990</option>" +
      "<option value=\"Semestral Tarjeta\">Semestral Tarjeta $182.990</option>" +
      "<option value=\"Semestral Transferencia\">Semestral Transf. $182.990</option>" +
      "<option value=\"Anual Tarjeta\">Anual Tarjeta $305.990</option>" +
      "<option value=\"Anual Transferencia\">Anual Transf. $305.990</option>" +
      "</select>" +
      "<button class=\"p3-plan-confirm\" onclick=\"cerrarVenta('" + p.id + "')\">✅ Confirmar</button>" +
      "</div>";
  } else {
    accionesHtml = (p.planVendido || p.cerradoPor) ?
      "<div style=\"font-size:0.75rem;color:#444;font-style:italic;padding:3px 0\">" +
      (p.planVendido ? "🏆 " + p.planVendido : "") +
      (p.cerradoPor ? " · Cerrado por " + p.cerradoPor : "") + "</div>" : "";
  }

  return "<div class=\"" + cardClass + "\">" +
    "<div class=\"p3-top\">" +
    "<div class=\"p3-info\">" +
    "<div class=\"p3-nombre\">" + p.nombre + "</div>" +
    "<div class=\"p3-contacto\">" + contactoInfo.join(" · ") + "</div>" +
    (p.consulta ? "<div class=\"p3-consulta\">" + p.consulta + "</div>" : "") +
    ultimaNotaHtml +
    "</div>" +
    "<div class=\"p3-right\">" +
    renderDiaBadge(dias, p.estado) +
    renderEstadoBadge(p.estado) +
    (!archivado ? "<button class=\"p3-del\" onclick=\"eliminarProspecto('" + p.id + "')\">✕</button>" : "") +
    "</div>" +
    "</div>" +
    "<div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:8px\">" +
    evoHtml +
    "<div class=\"p3-hist-toggle\" onclick=\"toggleHistorialProsp('" + p.id + "')\">📋 Historial (" + historial.length + ")</div>" +
    "</div>" +
    "<div class=\"p3-hist-body\" id=\"phist-" + p.id + "\">" + renderHistorial(historial) + "</div>" +
    accionesHtml +
    "</div>";
}

function renderAlertaTurno(prospectos) {
  var urgentes = prospectos.filter(function(p) {
    if (p.estado === "Cerrado" || p.estado === "Descartado") return false;
    return getDiaProspecto(p) >= 1;
  });
  if (!urgentes.length) return "";

  var items = urgentes.map(function(p) {
    var dias = getDiaProspecto(p);
    var diaKey = getDiaKey(dias);
    var label = diaKey === "d7" ? "Dia 7" : diaKey === "d3" ? "Dia 3" : "Dia 1";
    return "<div class=\"p3-alerta-item\">" +
      "<span class=\"p3-alerta-nombre\">" + p.nombre + "</span>" +
      "<span class=\"p3-dia-badge " + diaKey + "\">" + label + "</span>" +
      "</div>";
  }).join("");

  return "<div class=\"p3-alerta-turno\">" +
    "<div class=\"p3-alerta-titulo\">🔔 " + urgentes.length + " prospecto" + (urgentes.length !== 1 ? "s" : "") + " que contactar hoy</div>" +
    "<div class=\"p3-alerta-items\">" + items + "</div>" +
    "</div>";
}

async function cargarProspectos() {
  var cont = document.getElementById("prosp-lista");
  var alerta = document.getElementById("prosp-alerta");
  if (!cont) return;
  cont.innerHTML = "<div class=\"p3-empty\">Cargando...</div>";
  try {
    var res = await fetch(WEBAPP_URL + "?accion=listar");
    var data = await res.json();
    if (!data.prospectos || !data.prospectos.length) {
      cont.innerHTML = "<div class=\"p3-empty\">No hay prospectos registrados aun</div>";
      if (alerta) alerta.style.display = "none";
      return;
    }
    var todos = data.prospectos;
    var activos = todos.filter(function(p) { return p.estado !== "Cerrado" && p.estado !== "Descartado"; });
    var archivados = todos.filter(function(p) { return p.estado === "Cerrado" || p.estado === "Descartado"; });
    var urgentes = activos.filter(function(p) { return getDiaProspecto(p) >= 1; });

    if (alerta) {
      if (urgentes.length > 0) {
        alerta.textContent = urgentes.length + " para contactar";
        alerta.style.display = "inline-block"; alerta.style.color = "var(--red)"; alerta.style.fontWeight = "700";
      } else if (activos.length > 0) {
        alerta.textContent = activos.length + " activo" + (activos.length !== 1 ? "s" : "");
        alerta.style.display = "inline-block"; alerta.style.color = "#aaa"; alerta.style.fontWeight = "600";
      } else { alerta.style.display = "none"; }
    }

    var html = renderAlertaTurno(todos);
    if (activos.length > 0) {
      html += "<div class=\"p3-seccion\">📋 En seguimiento (" + activos.length + ")</div>";
      activos.sort(function(a, b) { return getDiaProspecto(b) - getDiaProspecto(a); });
      html += activos.map(function(p) { return renderProspCard(p, false); }).join("");
    }
    if (archivados.length > 0) {
      html += "<div class=\"p3-seccion\" style=\"color:#2a2a2a\">Cerrados / Descartados (" + archivados.length + ")</div>";
      html += archivados.map(function(p) { return renderProspCard(p, false); }).join("");
    }
    if (!html) html = "<div class=\"p3-empty\">No hay prospectos activos</div>";
    cont.innerHTML = html;
  } catch(e) {
    cont.innerHTML = "<div class=\"p3-empty\">Error al cargar prospectos</div>";
  }
}

async function cargarProspectosAdmin() {
  var cont = document.getElementById("admin-prosp-lista");
  if (!cont) return;
  try {
    var res = await fetch(WEBAPP_URL + "?accion=listar");
    var data = await res.json();
    if (!data.prospectos || !data.prospectos.length) {
      cont.innerHTML = "<div class=\"p3-empty\">No hay prospectos registrados</div>"; return;
    }
    var todos = data.prospectos;
    var activos = todos.filter(function(p) { return p.estado !== "Cerrado" && p.estado !== "Descartado"; });
    var cerrados = todos.filter(function(p) { return p.estado === "Cerrado" || p.estado === "Descartado"; });

    activos.sort(function(a, b) { return getDiaProspecto(b) - getDiaProspecto(a); });

    var html = renderAlertaTurno(todos);
    if (activos.length > 0) {
      html += "<div class=\"p3-seccion\">📋 En seguimiento (" + activos.length + ")</div>";
      html += activos.map(function(p) { return renderProspCard(p, true); }).join("");
    }
    if (cerrados.length > 0) {
      html += "<div class=\"p3-seccion\" style=\"color:#2a2a2a;margin-top:8px\">Cerrados / Descartados (" + cerrados.length + ")</div>";
      html += cerrados.slice(0, 20).map(function(p) { return renderProspCard(p, true); }).join("");
    }
    cont.innerHTML = html || "<div class=\"p3-empty\">Sin prospectos</div>";
  } catch(e) {
    cont.innerHTML = "<div class=\"p3-empty\">Error al cargar</div>";
  }
}



const PLANES_PRECIOS = {
  '1 persona · 4 sesiones': 88000,
  '1 persona · 8 sesiones': 160000,
  '1 persona · 12 sesiones': 204000,
  '2 personas · 4 sesiones': 152000,
  '2 personas · 8 sesiones': 256000,
  '2 personas · 12 sesiones': 288000,
  '3 personas · 4 sesiones': 180000,
  '3 personas · 8 sesiones': 288000,
  '3 personas · 12 sesiones': 324000,
};

let planSeleccionado = null;

function togglePlanesForm() {
  const f = document.getElementById('planes-form');
  f.classList.toggle('open');
}

function selectPlan(plan) {
  planSeleccionado = plan;
  document.querySelectorAll('.planes-option').forEach(el => {
    el.classList.toggle('selected', el.dataset.plan === plan);
  });
}

async function guardarPlan() {
  const cliente = document.getElementById('plan-cliente').value.trim();
  if (!cliente) { alert('Ingresa el nombre del cliente'); return; }
  if (!planSeleccionado) { alert('Selecciona un plan'); return; }
  const monto = PLANES_PRECIOS[planSeleccionado];
  const btn = document.getElementById('plan-save-btn');
  btn.textContent = 'Guardando...';
  btn.disabled = true;
  try {
    await fetch(WEBAPP_URL, {
      method: 'POST',
      body: JSON.stringify({ accion: 'agregarPlan', pt: currentUserPersona, cliente, plan: planSeleccionado, monto }),
    });
    document.getElementById('plan-cliente').value = '';
    planSeleccionado = null;
    document.querySelectorAll('.planes-option').forEach(el => el.classList.remove('selected'));
    document.getElementById('planes-form').classList.remove('open');
    cargarPlanes();
  } catch(e) { alert('Error al guardar'); }
  btn.textContent = 'Registrar plan';
  btn.disabled = false;
}

async function aprobarPlan(id) {
  if (!confirm('¿Confirmas el pago de este plan?')) return;
  await fetch(WEBAPP_URL, {
    method: 'POST',
    body: JSON.stringify({ accion: 'aprobarPlan', id }),
  });
  cargarPlanes();
  cargarPlanesAdmin();
}

async function eliminarPlan(id) {
  if (!confirm('¿Eliminar este plan?')) return;
  await fetch(WEBAPP_URL, {
    method: 'POST',
    body: JSON.stringify({ accion: 'eliminarPlan', id }),
  });
  cargarPlanes();
  cargarPlanesAdmin();
}

function renderPlanCard(p, esAdmin) {
  const ptParte = p.ptParte || Math.round(p.monto * 0.8);
  const gymParte = p.gymParte || Math.round(p.monto * 0.2);
  const sesiones = p.sesiones || 0;
  const matchSesiones = (p.plan || '').match(/(\d+) sesiones/);
  const totalSesiones = matchSesiones ? parseInt(matchSesiones[1]) : 0;
  const sesPct = totalSesiones > 0 ? Math.min(Math.round(sesiones / totalSesiones * 100), 100) : 0;
  const completado = sesiones >= totalSesiones && totalSesiones > 0;
  const estadoClass = p.estado === 'Pagado' || p.estado === 'Completado y Pagado' ? 'pagado' : completado ? 'pagado' : 'pendiente';

  return `
    <div class="planes-card ${estadoClass}">
      <div class="planes-card-header">
        <div>
          <div class="planes-card-nombre">${p.cliente}</div>
          <div class="planes-card-pt">${esAdmin ? p.pt + ' · ' : ''}${p.plan}</div>
        </div>
        <button class="planes-del-btn" onclick="eliminarPlan('${p.id}')">✕</button>
      </div>

      ${totalSesiones > 0 ? `
      <div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <span style="font-size:0.75rem;color:#888">Sesiones realizadas</span>
          <span style="font-family:'Bebas Neue',sans-serif;font-size:1rem;color:${completado ? 'var(--green)' : 'var(--white)'}">
            ${sesiones} / ${totalSesiones}
            ${completado ? ' ✅' : ''}
          </span>
        </div>
        <div class="prog-v2-track" style="height:6px">
          <div class="prog-v2-fill" style="width:${sesPct}%;background:${completado ? 'var(--green)' : sesPct > 60 ? 'var(--amber)' : 'var(--red)'}"></div>
        </div>
        ${!esAdmin && !completado ? `
        <div style="display:flex;gap:6px;margin-top:10px">
          <button class="planes-aprobar-btn" style="flex:1;background:rgba(192,57,43,0.15);color:var(--red);border:1px solid rgba(192,57,43,0.3)" onclick="sumarSesion('${p.id}', ${sesiones}, ${totalSesiones})">
            ➕ Registrar sesión
          </button>
          ${sesiones > 0 ? `<button class="planes-aprobar-btn" style="background:rgba(255,255,255,0.04);color:#666;border:1px solid #222;padding:7px 12px" onclick="restarSesion('${p.id}', ${sesiones})" title="Deshacer última sesión">➖</button>` : ''}
        </div>` : ''}
      </div>` : ''}

      <div class="planes-montos">
        <div class="planes-monto-box">
          <div class="planes-monto-label">Total plan</div>
          <div class="planes-monto-val" style="color:var(--white)">${fmt(p.monto)}</div>
        </div>
        <div class="planes-monto-box">
          <div class="planes-monto-label">${esAdmin ? 'PT (80%)' : 'Tu parte (80%)'}</div>
          <div class="planes-monto-val" style="color:var(--green)">${fmt(ptParte)}</div>
        </div>
        <div class="planes-monto-box">
          <div class="planes-monto-label">Gym (20%)</div>
          <div class="planes-monto-val" style="color:var(--amber)">${fmt(gymParte)}</div>
        </div>
        <div class="planes-monto-box">
          <div class="planes-monto-label">Estado pago</div>
          <div>
            <span class="planes-estado ${estadoClass}">
              ${p.estado === 'Pagado' || p.estado === 'Completado y Pagado' ? '✓ Pagado' : completado ? '✅ Completado' : '⏳ Pendiente'}
            </span>
          </div>
        </div>
      </div>
      ${(p.estado !== 'Pagado' && p.estado !== 'Completado y Pagado') && esAdmin ? `<button class="planes-aprobar-btn" onclick="aprobarPlan('${p.id}')" style="margin-top:8px">✅ Aprobar pago</button>` : ''}
    </div>`;
}

async function restarSesion(id, sesiones) {
  if (sesiones <= 0) return;
  if (!confirm('¿Deshacer la última sesión registrada?')) return;
  await fetch(WEBAPP_URL, {
    method: 'POST',
    body: JSON.stringify({ accion: 'restarSesion', id }),
  });
  cargarPlanes();
  cargarPlanesAdmin();
}

async function sumarSesion(id, sesiones, totalSesiones) {
  if (sesiones >= totalSesiones) {
    alert('Este plan ya está completado (' + totalSesiones + '/' + totalSesiones + ' sesiones)');
    return;
  }
  await fetch(WEBAPP_URL, {
    method: 'POST',
    body: JSON.stringify({ accion: 'sumarSesion', id }),
  });
  cargarPlanes();
  cargarPlanesAdmin();
}

async function cargarPlanes() {
  const cont = document.getElementById('planes-lista');
  if (!cont) return;
  try {
    const res = await fetch(WEBAPP_URL + '?accion=listarPlanes');
    const data = await res.json();
    const misPlanes = (data.planes || []).filter(p => p.pt === currentUserPersona);
    if (misPlanes.length === 0) {
      cont.innerHTML = '<div class="prosp-empty">No tienes planes registrados este mes</div>';
      return;
    }
    const pendientes = misPlanes.filter(p => p.estado !== 'Pagado');
    const pagados = misPlanes.filter(p => p.estado === 'Pagado');
    let html = '';
    if (pendientes.length > 0) {
      html += '<div class="planes-group-label">Pendientes de pago</div>';
      html += pendientes.map(p => renderPlanCard(p, false)).join('');
    }
    if (pagados.length > 0) {
      html += '<div class="planes-group-label">Pagados</div>';
      html += pagados.map(p => renderPlanCard(p, false)).join('');
    }
    cont.innerHTML = html;
  } catch(e) {
    cont.innerHTML = '<div class="prosp-empty">Error al cargar</div>';
  }
}

async function cargarPlanesAdmin() {
  const cont = document.getElementById('planes-admin-lista');
  const alerta = document.getElementById('planes-admin-alerta');
  if (!cont) return;
  try {
    const res = await fetch(WEBAPP_URL + '?accion=listarPlanes');
    const data = await res.json();
    const planes = data.planes || [];
    const pendientes = planes.filter(p => p.estado !== 'Pagado');

    if (alerta) {
      if (pendientes.length > 0) {
        alerta.textContent = '🔴 ' + pendientes.length + ' plan' + (pendientes.length > 1 ? 'es' : '') + ' esperan tu aprobación';
        alerta.classList.add('visible');
      } else {
        alerta.classList.remove('visible');
      }
    }

    if (planes.length === 0) {
      cont.innerHTML = '<div class="prosp-empty">No hay planes registrados</div>';
      return;
    }

    // Agrupar por PT
    const grupos = {};
    planes.forEach(p => {
      if (!grupos[p.pt]) grupos[p.pt] = [];
      grupos[p.pt].push(p);
    });

    cont.innerHTML = Object.entries(grupos).map(([pt, pls]) => {
      const pend = pls.filter(p => p.estado !== 'Pagado');
      const totalPT = pls.reduce((s, p) => s + (p.ptParte || Math.round(p.monto * 0.8)), 0);
      return `
        <div class="admin-prosp-acord">
          <div class="admin-prosp-header" onclick="toggleAcord('planes-pt-${pt}')">
            <div>
              <div class="admin-prosp-title">${pt}</div>
              <div class="admin-prosp-meta">${pls.length} plan${pls.length !== 1 ? 'es' : ''} · Total PT: ${fmt(totalPT)}</div>
            </div>
            <div class="admin-prosp-badges">
              ${pend.length > 0 ? `<span class="admin-badge-count admin-badge-urgente">🔴 ${pend.length} pendiente${pend.length > 1 ? 's' : ''}</span>` : '<span class="admin-badge-count admin-badge-ok">✓ Al día</span>'}
              <span class="acord-chev" id="chev-planes-pt-${pt}">▼</span>
            </div>
          </div>
          <div class="admin-prosp-body" id="planes-pt-${pt}">
            ${pls.map(p => renderPlanCard(p, true)).join('')}
          </div>
        </div>`;
    }).join('');
  } catch(e) {
    cont.innerHTML = '<div class="prosp-empty">Error al cargar</div>';
  }
}

function agenteSugerir(texto) {
  const input = document.getElementById('agente-input');
  if (input) { input.value = texto; agenteEnviar(); }
}

async function agenteEnviar() {
  const input = document.getElementById('agente-input');
  const btn = document.getElementById('agente-send');
  const cont = document.getElementById('agente-mensajes');
  if (!input || !cont) return;

  const texto = input.value.trim();
  if (!texto) return;

  input.value = '';
  if (btn) btn.disabled = true;

  // Limpiar bienvenida si existe
  const bienvenida = cont.querySelector('.agente-bienvenida');
  if (bienvenida) bienvenida.remove();

  // Agregar burbuja usuario
  const burbujaUser = document.createElement('div');
  burbujaUser.className = 'agente-burbuja usuario';
  burbujaUser.textContent = texto;
  cont.appendChild(burbujaUser);

  // Burbuja typing
  const burbujaTyping = document.createElement('div');
  burbujaTyping.className = 'agente-burbuja ia typing';
  burbujaTyping.textContent = 'Escribiendo...';
  cont.appendChild(burbujaTyping);
  cont.scrollTop = cont.scrollHeight;

  // Agregar al historial
  agenteHistorial.push({ role: 'user', content: texto });

  try {
    const baseDoc = await fetchBaseConocimiento();
    const systemFinal = AGENTE_SYSTEM + (baseDoc ? ('\n\n════════════════════════════════════════\nBASE DE CONOCIMIENTO OFICIAL GYM FACTORY (leer antes de responder):\n════════════════════════════════════════\n' + baseDoc) : '');

    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': AGENTE_API_KEY,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 600,
        system: systemFinal,
        messages: agenteHistorial
      })
    });

    const data = await res.json();
    const respuesta = data.content && data.content[0] ? data.content[0].text : 'No pude responder, intenta de nuevo.';

    // Agregar al historial
    agenteHistorial.push({ role: 'assistant', content: respuesta });

    // Reemplazar typing por respuesta
    burbujaTyping.className = 'agente-burbuja ia';
    burbujaTyping.innerHTML = respuesta.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

    // Limitar historial a 10 turnos para no gastar tokens
    if (agenteHistorial.length > 20) agenteHistorial = agenteHistorial.slice(-20);

  } catch(e) {
    burbujaTyping.className = 'agente-burbuja ia';
    burbujaTyping.textContent = 'Error: ' + e.message + '. Intenta de nuevo.';
    console.error('Agente error:', e);
  }

  cont.scrollTop = cont.scrollHeight;
  if (btn) btn.disabled = false;
  if (input) input.focus();
}

function agenteKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); agenteEnviar(); }
}
