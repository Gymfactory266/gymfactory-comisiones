<style>
  :root {

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--black); color: var(--white); min-height: 100vh; }

<script>
const SUPABASE_URL = 'https://plncbeggdlnsqwthzrmw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_YNiL8p5nP1NAfRsk8cgtRQ_9_zlN1Ve';

const SHEET_ID = '1vzB0wssprNnXEHi-Tx3fc_ZfVpkudUsuGOEu_JhnGT4';
const URL_SHEET = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Comisiones`;

const EMAIL_MAP = {
  'gonzaloescobarhidalgo89@gmail.com': null,

  'javierasep.o@gmail.com': 'Javiera',
};

const PERSONAS = {
  Massiel: { color: '#378ADD', bg: 'rgba(55,138,221,0.2)', rol: 'Recepcion' },
  Sara:    { color: '#1D9E75', bg: 'rgba(29,158,117,0.2)', rol: 'Recepcion' },
  Camila:  { color: '#EF9F27', bg: 'rgba(239,159,39,0.2)', rol: 'Recepcion' },
  Luis:    { color: '#7F77DD', bg: 'rgba(127,119,221,0.2)', rol: 'Profesor/PT' },
  Diego:   { color: '#D85A30', bg: 'rgba(216,90,48,0.2)', rol: 'Profesor/PT' },
  Javiera: { color: '#D4537E', bg: 'rgba(212,83,126,0.2)', rol: 'Profesor/PT' },
};

const COM_PLANES = {
  pacMensual: 2000,
  semestralTarjeta: 4000, semestralTransf: 6000,
  anualTarjeta: 6000, anualTransf: 8000,
};

const medals = ['🥇','🥈','🥉'];
const fmt = n => '$' + Math.round(n||0).toLocaleString('es-CL');
let currentUserPersona = null;

const ahora = new Date();
document.getElementById('hdr-date').textContent = ahora.toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'});

document.getElementById('login-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');

  const { data, error } = await db.auth.signInWithPassword({ email, password: pass });
  if (error) { err.style.display = 'block'; btn.disabled = false; btn.textContent = 'Ingresar'; }
  else { currentUserPersona = EMAIL_MAP[email.toLowerCase()] ?? EMAIL_MAP[email] ?? null; showApp(); }
}

async function doLogout() {
  await db.auth.signOut();
  currentUserPersona = null;
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';

  document.getElementById('login-pass').value = '';
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  if (currentUserPersona) document.getElementById('hdr-subtitle').textContent = 'Mis comisiones · ' + currentUserPersona;
  loadData();
  setTimeout(initGuias, 800);
}

db.auth.getSession().then(async ({ data: { session } }) => {
  if (session) {
    currentUserPersona = EMAIL_MAP[session.user.email.toLowerCase()] ?? EMAIL_MAP[session.user.email] ?? null;
    showApp();
  }
});

function getV(row, col) {
  try {
    const v = row.c[col]?.v;
    if (v === null || v === undefined) return 0;
    if (typeof v === 'number') return v;
    if (typeof v === 'string' && v !== '-') return parseFloat(v) || 0;
    return 0;
  } catch(e) { return 0; }
}
function getTxt(row, col) {
  try { return row.c[col]?.v || ''; } catch(e) { return ''; }
}

async function loadData() {
  try {
    const res = await fetch(URL_SHEET + '&t=' + Date.now());
    const text = await res.text();
    const match = text.match(/google\.visualization\.Query\.setResponse\((.*)\)/s);
    if (!match) throw new Error('No se pudo leer Google Sheets');
    const json = JSON.parse(match[1]);
    const rows = json.table.rows;

    const names = ['Massiel','Sara','Camila','Luis','Diego','Javiera'];
    const data = names.map((name, i) => ({
      name,
      comisiones:        getV(rows[i], 1),
      pacPagados:        getV(rows[i], 2),
      bonoPac:           getV(rows[i], 3), // columna D — bono PAC individual
      bonoSupl:          getV(rows[i], 4), // columna E — bono supl individual
      total:             getV(rows[i], 5),
      suplTexto:         getTxt(rows[i], 6),
      pacGrupal:         getV(rows[i], 7),
      pacMensual:        getV(rows[i], 8),
      semTarjeta:        getV(rows[i], 9),
      semTransf:         getV(rows[i], 10),
      anuTarjeta:        getV(rows[i], 11),
      anuTransf:         getV(rows[i], 12),
      pacTotalReal:      getV(rows[i], 13),
      pacFaltanSig:      getV(rows[i], 14),
      ventasSuplPersona: getV(rows[i], 15),
      comisionSupl:      getV(rows[i], 16),
    }));

    const totalPacGrupal   = rows[6]  ? getV(rows[6], 2) : 0;
    const totalCom         = rows[6]  ? getV(rows[6], 5) : 0;
    const totalPacReal     = rows[6]  ? getV(rows[6], 13) : 0;
    const bonoPacTotal     = rows[7]  ? getV(rows[7], 1) : 0;
    const pacSiguiente     = rows[8]  ? getTxt(rows[8], 1) : '';
    const bonoSuplTotal    = rows[9]  ? getV(rows[9], 1) : 0;
    const ventasSuplReales = rows[10] ? getV(rows[10], 1) : 0;
    const suplFaltan550k   = rows[11] ? getV(rows[11], 1) : 0;
    const transferenciasPend = rows[12] ? getV(rows[12], 1) : 0;
    const transfDetalle = [];
    for (let r = 13; r < rows.length; r++) {
      if (!rows[r] || !rows[r].c || !rows[r].c[0] || !rows[r].c[0].v) break;
      const txt = rows[r].c[0].v;
      if (txt === '--- Detalle transferencias ---' || txt === 'Sin transferencias pendientes') continue;
      transfDetalle.push({ info: txt, comision: getV(rows[r], 1) });
    }

    if (currentUserPersona) {
      const miData = data.find(d => d.name === currentUserPersona);
      const sorted = [...data].sort((a,b) => b.total - a.total);
      const miRank = sorted.findIndex(d => d.name === currentUserPersona) + 1;
      renderPersonal(miData, miRank, totalPacGrupal, totalPacReal, bonoPacTotal, pacSiguiente, bonoSuplTotal, ventasSuplReales, suplFaltan550k, sorted);
    } else {
      renderDashboard(data, totalCom, totalPacGrupal, totalPacReal, bonoPacTotal, pacSiguiente, bonoSuplTotal, ventasSuplReales, suplFaltan550k, transferenciasPend, transfDetalle);
    }
  } catch(e) {
    document.getElementById('main').innerHTML = `<div class="error-box"><strong>Error al cargar datos</strong><br>${e.message}</div>`;
  }
}

function bonosHtml(p) {
  if (p.bonoPac <= 0 && p.bonoSupl <= 0) return '';
  return `
    <div class="bono-card">
      <div class="bono-card-title">🎉 Bonos grupales activados</div>
      ${p.bonoPac > 0 ? `<div class="bono-row"><span>Bono PAC (proporcional)</span><span class="bono-val">${fmt(p.bonoPac)}</span></div>` : ''}
      ${p.bonoSupl > 0 ? `<div class="bono-row"><span>Bono suplementos (proporcional)</span><span class="bono-val">${fmt(p.bonoSupl)}</span></div>` : ''}
      <div class="bono-row" style="border-top:1px solid rgba(29,158,117,0.2);margin-top:6px;padding-top:6px">
        <span style="font-weight:600">Total bonos</span>
        <span class="bono-val">${fmt(p.bonoPac + p.bonoSupl)}</span>
      </div>
    </div>`;
}

function buildDetalle(p, ventasSuplReales) {
  const style = PERSONAS[p.name] || {color:'#888'};
  const tipo = ['Massiel','Sara'].includes(p.name) ? 'recepcion' :
               p.name === 'Camila' ? 'recepcion_part' : 'pt';

  let pacHtml = '';
  if (tipo !== 'pt') {
    const pisoLabel = tipo === 'recepcion' ? 'Piso: 10, luego cada 5' : 'Piso: 5, luego cada 3';
    const pisoActual = tipo === 'recepcion' ? 10 : 5;
    pacHtml = `
      <div class="detalle-titulo">Estado PAC</div>
      <div class="info-row"><span>${pisoLabel}</span></div>
      <div class="info-row">PAC vendidos este mes <span class="${p.pacTotalReal > 0 ? 'ok' : ''}">${p.pacTotalReal}</span></div>
      <div class="info-row">PAC pagados (llegaron a piso) <span class="${p.pacPagados > 0 ? 'ok' : ''}">${p.pacPagados}</span></div>
      <div class="info-row">PAC sobrantes (50% comision) <span>${p.pacTotalReal - p.pacPagados}</span></div>
      <div class="info-row">Faltan para proximo piso <span class="red">${p.pacFaltanSig}</span></div>
      <div class="prog-mini">
        <div class="prog-mini-track"><div class="prog-mini-fill ${p.pacPagados > 0 ? 'green' : ''}" style="width:${Math.min(p.pacTotalReal / pisoActual * 100, 100)}%"></div></div>
      </div>`;
  }

  let semHtml = '';
  if (tipo !== 'pt') {
    const totalSem = p.semTarjeta + p.semTransf;
    const pisoBySem = tipo === 'recepcion_part' ? 2 : tipo === 'recepcion' ? 5 : 3;
    const semPagados = totalSem >= pisoBySem ? pisoBySem + Math.floor((totalSem - pisoBySem) / 2) * 2 : 0;
    const semSobrantes = totalSem - semPagados;
    const semFaltan = totalSem < pisoBySem ? pisoBySem - totalSem : semSobrantes === 1 ? 1 : 0;
    const semPct = Math.min(Math.round(totalSem / pisoBySem * 100), 100);
    const comSemTotal = p.semTarjeta * COM_PLANES.semestralTarjeta + p.semTransf * COM_PLANES.semestralTransf;
    semHtml = `
      <div class="detalle-titulo" style="margin-top:12px">Semestrales · ${fmt(comSemTotal)}</div>
      <div class="info-row">Piso: ${pisoBySem}, luego cada 2 <span style="color:#666">se pagan completos</span></div>
      <div class="info-row">Vendidos <span class="${totalSem > 0 ? 'ok' : ''}">${totalSem}</span></div>
      <div class="info-row">Pagados al 100% <span class="${semPagados > 0 ? 'ok' : ''}">${semPagados}</span></div>
      <div class="info-row">Sobrantes (50%) <span>${semSobrantes}</span></div>
      ${semFaltan > 0 ? `<div class="info-row">Faltan para piso <span class="red">${semFaltan}</span></div>` : '<div class="info-row">Piso alcanzado <span class="ok">✓</span></div>'}
      ${p.semTarjeta > 0 ? `<div class="info-row">Semestral Tarjeta × ${p.semTarjeta} <span class="ok">${fmt(p.semTarjeta * COM_PLANES.semestralTarjeta)}</span></div>` : ''}
      ${p.semTransf > 0 ? `<div class="info-row">Semestral Transf. × ${p.semTransf} <span class="ok">${fmt(p.semTransf * COM_PLANES.semestralTransf)}</span></div>` : ''}
      <div class="prog-mini">
        <div class="prog-mini-track"><div class="prog-mini-fill ${semPagados > 0 ? 'green' : ''}" style="width:${semPct}%"></div></div>
      </div>`;
  }

  let anuHtml = '';
  if (tipo !== 'pt') {
    const totalAnu = p.anuTarjeta + p.anuTransf;
    const pisoByAnu = tipo === 'recepcion_part' ? 2 : tipo === 'recepcion' ? 5 : 3;
    const anuPagados = totalAnu >= pisoByAnu ? pisoByAnu + Math.floor((totalAnu - pisoByAnu) / 2) * 2 : 0;
    const anuSobrantes = totalAnu - anuPagados;
    const anuFaltan = totalAnu < pisoByAnu ? pisoByAnu - totalAnu : anuSobrantes === 1 ? 1 : 0;
    const anuPct = Math.min(Math.round(totalAnu / pisoByAnu * 100), 100);
    const comAnuTotal = p.anuTarjeta * COM_PLANES.anualTarjeta + p.anuTransf * COM_PLANES.anualTransf;
    anuHtml = `
      <div class="detalle-titulo" style="margin-top:12px">Anuales · ${fmt(comAnuTotal)}</div>
      <div class="info-row">Piso: ${pisoByAnu}, luego cada 2 <span style="color:#666">se pagan completos</span></div>
      <div class="info-row">Vendidos <span class="${totalAnu > 0 ? 'ok' : ''}">${totalAnu}</span></div>
      <div class="info-row">Pagados al 100% <span class="${anuPagados > 0 ? 'ok' : ''}">${anuPagados}</span></div>
      <div class="info-row">Sobrantes (50%) <span>${anuSobrantes}</span></div>
      ${anuFaltan > 0 ? `<div class="info-row">Faltan para piso <span class="red">${anuFaltan}</span></div>` : '<div class="info-row">Piso alcanzado <span class="ok">✓</span></div>'}
      ${p.anuTarjeta > 0 ? `<div class="info-row">Anual Tarjeta × ${p.anuTarjeta} <span class="ok">${fmt(p.anuTarjeta * COM_PLANES.anualTarjeta)}</span></div>` : ''}
      ${p.anuTransf > 0 ? `<div class="info-row">Anual Transf. × ${p.anuTransf} <span class="ok">${fmt(p.anuTransf * COM_PLANES.anualTransf)}</span></div>` : ''}
      <div class="prog-mini">
        <div class="prog-mini-track"><div class="prog-mini-fill ${anuPagados > 0 ? 'green' : ''}" style="width:${anuPct}%"></div></div>
      </div>`;
  }

  const suplActivo = ventasSuplReales >= 550000;
  const suplHtml = p.suplTexto ? `
    <div class="detalle-titulo" style="margin-top:12px">Suplementos vendidos</div>
    <div class="info-row">Comision individual <span class="${suplActivo ? 'ok' : 'red'}">${suplActivo ? '100% activa' : '50% (equipo bajo $550k)'}</span></div>
    <div class="info-row">Ventas supl este mes <span>${fmt(p.ventasSuplPersona)}</span></div>
    <div class="info-row">Comision suplementos <span class="ok">${fmt(p.comisionSupl)}</span></div>
    <div class="detalle-supl" style="margin-top:8px">
      ${p.suplTexto.split(',').map(s => s.trim() ? `<span class="supl-tag">${s.trim()}</span>` : '').join('')}
    </div>` : '';

  const bonosDetalle = (p.bonoPac > 0 || p.bonoSupl > 0) ? `
    <div class="detalle-titulo" style="margin-top:12px;color:var(--green)">Bonos grupales</div>
    ${p.bonoPac > 0 ? `<div class="info-row">Bono PAC (proporcional) <span class="ok">${fmt(p.bonoPac)}</span></div>` : ''}
    ${p.bonoSupl > 0 ? `<div class="info-row">Bono suplementos (proporcional) <span class="ok">${fmt(p.bonoSupl)}</span></div>` : ''}` : '';

  return `
    <div class="detalle-persona" id="detalle-${p.name}">
      ${pacHtml}${semHtml}${anuHtml}${suplHtml}${bonosDetalle}
      <div class="detalle-total">
        <div class="detalle-total-label">Total con bonos</div>
        <div class="detalle-total-val">${fmt(p.total)}</div>
      </div>
    </div>`;
}

function toggleDetalle(name) {
  const el = document.getElementById(`detalle-${name}`);

  pdf_profesores: { type: 'html', data: '<p><strong>GYM FACTORY</strong></p><p><em>Fitness, el lujo de la nueva era.</em></p><p><strong>GUIA DE PROFESORES Y PT</strong></p><p>Recorrido · Suplementos · Evaluacion · Objeciones</p><p>Mayo 2026 · Version final</p><p><strong>Tu rol en la venta</strong></p><table><tr><td><p><strong>No vendes planes. Vendes la experiencia. Tu unico objetivo durante el recorrido: que el cliente sienta \'aqui quiero entrenar\' antes de llegar al meson.</strong></p></td></tr></table><p><strong>Script del recorrido</strong></p><table><tr><td><p><strong>Zona</strong></p></td><td><p><strong>Script</strong></p></td></tr><tr><td><p>Entrada</p></td><td><p>Lo primero que vas a notar es que el ambiente es distinto. Siempre limpio, climatizado y con buena energia.</p></td></tr><tr><td><p>Sala de maquinas</p></td><td><p>Las maquinas son de primera linea, nunca vas a tener que esperar. Mancuernas hasta 50 kg y stacks reforzados.</p></td></tr><tr><td><p>Cardio</p></td><td><p>El area de cardio esta siempre disponible. Ideal para calentar o los dias que quieres trabajar mas resistencia.</p></td></tr><tr><td><p>Camarines</p></td><td><p>Tienen ducha, lockers, secador de pelo y plancha. Puedes venir directo del trabajo o irte al trabajo despues.</p></td></tr><tr><td><p>Cierre del recorrido</p></td><td><p>Que te parecio? Esto es lo que te espera cada vez que vengas. Te acompano de vuelta para que veas los planes?</p></td></tr></table><p><strong>Adaptar segun perfil</strong></p><table><tr><td><p><strong>Perfil</strong></p></td><td><p><strong>Que enfatizar</strong></p></td></tr><tr><td><p>Principiante</p></td><td><p>Aca va gente de todo nivel. Nadie te va a mirar raro. El ambiente es comodo.</p></td></tr><tr><td><p>Quiere bajar de peso</p></td><td><p>La combinacion de maquinas y cardio es ideal para tu objetivo.</p></td></tr><tr><td><p>Avanzado</p></td><td><p>Las mancuernas llegan a 50 kg y los stacks estan reforzados. No tendras limitaciones.</p></td></tr><tr><td><p>Adulto mayor</p></td><td><p>El espacio es comodo, no hay aglomeracion y siempre hay alguien que te orienta.</p></td></tr></table><p><strong>Suplementos · Tu momento clave es la evaluacion</strong></p><table><tr><td><p><strong>Tu tienes la mayor credibilidad para recomendar suplementos. Una derivacion tuya convierte casi siempre.</strong></p></td></tr></table><p><strong>Pregunta 1 · Objetivo</strong></p><p><em>&quot;Que estas buscando con el entrenamiento? Bajar de peso, ganar musculo, tener mas energia o mantenerte?&quot;</em></p><p><strong>Pregunta 2 · Experiencia</strong></p><p><em>&quot;Llevas mucho tiempo entrenando o estas empezando?&quot;</em></p><table><tr><td><p><strong>Objetivo</strong></p></td><td><p><strong>Primero</strong></p></td><td><p><strong>Complemento</strong></p></td></tr><tr><td><p>Ganar musculo</p></td><td><p>Creatina + Proteina</p></td><td><p>Glutamina si entrena 5+ dias</p></td></tr><tr><td><p>Bajar de peso</p></td><td><p>Proteina + Cafeina caps</p></td><td><p>HCA si hay ansiedad por comida</p></td></tr><tr><td><p>Mas energia</p></td><td><p>Cafeina o Pre-entreno Hyde</p></td><td><p>Carbosnack si entrena ayunas</p></td></tr><tr><td><p>Recuperacion</p></td><td><p>Creatina + Glutamina</p></td><td><p>Magnesio si hay calambres</p></td></tr><tr><td><p>Resistencia</p></td><td><p>Beta Alanina + Creatina</p></td><td><p>Carbox si hay sesiones largas</p></td></tr><tr><td><p>Adulto mayor</p></td><td><p>Creatina + Magnesio</p></td><td><p>Proteina para mantener masa muscular</p></td></tr></table><p><strong>Objeciones frecuentes</strong></p><table><tr><td><p><strong>Si no sabes la respuesta, no inventes. Deriva a recepcion. Derivar bien es mejor que responder mal.</strong></p></td></tr></table><p><strong>Durante el recorrido</strong></p><table><tr><td><p><strong>Objecion</strong></p></td><td><p><strong>Respuesta</strong></p></td></tr><tr><td><p>¿Cuanto cuesta?</p></td><td><p>En recepcion te explican todos los planes. Primero termina de conocer el gimnasio y despues decides con toda la info.</p></td></tr><tr><td><p>Se ve lleno</p></td><td><p>El aforo esta controlado, nunca vas a esperar maquinas. Eso es lo que diferencia Gym Factory.</p></td></tr><tr><td><p>No tengo experiencia</p></td><td><p>Aca es exactamente donde se aprende bien. Tenemos personal trainers y siempre hay alguien que te orienta.</p></td></tr><tr><td><p>¿Y si no me gusta?</p></td><td><p>Para eso existe el pase diario a $6.990: vienes hoy, conoces todo y despues decides.</p></td></tr></table><p><strong>De suplementos</strong></p><table><tr><td><p><strong>Objecion</strong></p></td><td><p><strong>Respuesta</strong></p></td></tr><tr><td><p>No quiero ponerme muy grande</p></td><td><p>La creatina y la proteina no hacen eso. Requeriria años de entrenamiento muy especifico.</p></td></tr><tr><td><p>¿Son naturales?</p></td><td><p>La creatina existe en la carne y el pescado. La proteina en polvo es simplemente proteina concentrada.</p></td></tr><tr><td><p>¿Tienen efectos secundarios?</p></td><td><p>La creatina y la proteina son los suplementos mas estudiados del mundo, completamente seguros.</p></td></tr><tr><td><p>¿Los necesito para ver resultados?</p></td><td><p>No los necesitas, pero aceleran los resultados. La creatina mejora el rendimiento 10-15% desde las primeras semanas.</p></td></tr></table><p><strong>Tu sistema de comisiones · Con ejemplos</strong></p><table><tr><td><p>Comisiona quien vende. Si derivas a recepcion y ellos cierran, la comision es de recepcion. Si tu vendes directamente, la comision es tuya.</p></td></tr></table><table><tr><td><p><strong>Suplemento vendido</strong></p></td><td><p><strong>Comision</strong></p></td></tr><tr><td><p>Creatina 4Active 1kg</p></td><td><p>$3.000</p></td></tr><tr><td><p>Creatina 4Active 600gr</p></td><td><p>$2.000</p></td></tr><tr><td><p>Creatina 60 srv / Inner Armour</p></td><td><p>$1.500</p></td></tr><tr><td><p>BPI HD ISO / Dragon Pharma 5lbs</p></td><td><p>$1.500</p></td></tr><tr><td><p>Hyde Nightmare Pre-entreno</p></td><td><p>$1.000</p></td></tr><tr><td><p>Isox / PS Whey / Whey 5lbs</p></td><td><p>$1.000 </p></td></tr><tr><td><p>Puretech / Pure Whey 900gr</p></td><td><p>$800</p></td></tr><tr><td><p>Carbox / Beta Alanina</p></td><td><p>$1000</p></td></tr><tr><td><p>Glutamina / Cafeina / Magnesio / HCA</p></td><td><p>$1000</p></td></tr><tr><td><p>Gorro (precio rebajado $15.000)</p></td><td><p>$1.000</p></td></tr><tr><td><p>Toalla</p></td><td><p>$500</p></td></tr><tr><td><p>Liquidos / Barritas / Candados / Chicles</p></td><td><p>Sin comision</p></td></tr></table><p><strong>Ejemplos prácticos · Comisiones de suplementos</strong></p><table><tr><td colspan="2"><p><strong>Ejemplo 1: Massiel vende 2 creatinas 600gr y 1 proteina Dragon Pharma en un dia</strong></p></td></tr><tr><td><p>2 creatinas 600gr x $2.000</p></td><td><p>$4.000</p></td></tr><tr><td><p>1 Dragon Pharma 5lbs x $1.500</p></td><td><p>$1.500</p></td></tr><tr><td><p><strong>Comision del dia</strong></p></td><td><p><strong>$5.500</strong></p></td></tr></table><table><tr><td><p><strong>Ejemplo 2: El profesor recomienda creatina en una evaluacion y el cliente la compra en recepcion</strong></p></td></tr></table><p>El profesor deriva → el cliente va a recepcion → Sara cierra la venta → Sara se lleva la comision de $2.000. El profesor no comisiona porque no cerro el.</p><table><tr><td><p><strong>Ejemplo 3: El profesor vende directamente una creatina 1kg durante el entrenamiento</strong></p></td></tr></table><p>El profesor cierra la venta directamente → el profesor se lleva la comision de $3.000.</p><p><strong>Ejemplos prácticos · Bono grupal suplementos</strong></p><p>El baseline actual es $550.000/mes. El bono grupal se activa solo si el equipo vende MAS que eso en suplementos grandes.</p><table><tr><td><p><strong>Ejemplo 1: El equipo vende $680.000 en suplementos grandes → bono $10.000</strong></p></td></tr></table><p>Massiel vendio $350.000, Sara vendio $230.000, Profesor vendio $100.000.</p><table><tr><td><p><strong>Persona</strong></p></td><td><p><strong>Vendio</strong></p></td><td><p><strong>Parte del bono</strong></p></td></tr><tr><td><p>Massiel</p></td><td><p>$350k = 51%</p></td><td><p>$5.147</p></td></tr><tr><td><p>Sara</p></td><td><p>$230k = 34%</p></td><td><p>$3.382</p></td></tr><tr><td><p>Profesor</p></td><td><p>$100k = 15%</p></td><td><p>$1.471</p></td></tr></table><table><tr><td><p><strong>Ejemplo 2: El equipo vende $820.000 en suplementos grandes → bono $20.000</strong></p></td></tr></table><p>Massiel vendio $400.000, Sara vendio $280.000, Profesor vendio $140.000.</p><table><tr><td><p><strong>Persona</strong></p></td><td><p><strong>Vendio</strong></p></td><td><p><strong>Parte del bono</strong></p></td></tr><tr><td><p>Massiel</p></td><td><p>$400k = 49%</p></td><td><p>$9.756</p></td></tr><tr><td><p>Sara</p></td><td><p>$280k = 34%</p></td><td><p>$6.829</p></td></tr><tr><td><p>Profesor</p></td><td><p>$140k = 17%</p></td><td><p>$3.415</p></td></tr></table><table><tr><td><p>Importante: si el equipo vende $530.000 (bajo el baseline de $541.827), no hay bono grupal aunque vendan mas que el mes anterior. El bono solo se activa si se supera el baseline.</p></td></tr></table><table><tr><td><p>Las comisiones se pagan si el mes supera $20M en ventas totales del gimnasio.</p></td></tr></table><p><strong>Reglas de oro del profesor</strong></p><table><tr><td><p>1.  El recorrido activa la emocion. Sin emocion, recepcion tiene que trabajar el doble.</p></td></tr><tr><td><p>2.  Pasar siempre el dato clave del cliente a recepcion antes del cierre.</p></td></tr><tr><td><p>3.  Diagnosticar antes de recomendar cualquier suplemento. Dos preguntas.</p></td></tr><tr><td><p>4.  Nunca ofrecer mas de 2 suplementos a la vez. Mas opciones paralizan.</p></td></tr><tr><td><p>5.  Si no sabes la respuesta, derivar a recepcion. No inventar.</p></td></tr><tr><td><p>6.  La creatina es el primer suplemento a ofrecer siempre, sin importar el perfil.</p></td></tr><tr><td><p>7.  Los gorros y toallas tambien tienen comision. </p></td></tr></table><p><strong>GYM FACTORY · Membrillar 266, Rancagua</strong></p>', label: 'Guía Profesores' },
  pdf_conjunto: { type: 'html', data: '<p><strong>GYM FACTORY</strong></p><p><em>Fitness, el lujo de la nueva era.</em></p><p><strong>PROTOCOLO CONJUNTO</strong></p><p><strong>Recepción + PT · Trabajo en equipo para cerrar ventas</strong></p><p>Junio 2026</p><h1>1. POR QUÉ EXISTE ESTE PROTOCOLO</h1><p><strong>Cuando recepción y PT trabajan solos, se pierden la mitad de las ventas. Cuando trabajan conectados, el cliente siente que lo conocen — y eso cierra solo.</strong></p><p>El cliente que visita Gym Factory pasa por dos momentos clave: el diagnóstico en recepción y el recorrido con el PT. Si esos dos momentos no están conectados, el cliente percibe que está hablando con dos personas distintas que no saben nada el uno del otro.</p><p>Cuando están conectados, el cliente siente algo completamente distinto: &quot;estas personas me conocen, me entendieron, me están ofreciendo exactamente lo que necesito.&quot; Eso es lo que convierte una visita en una venta.</p><table><tr><td><p><strong>Sin protocolo conjunto</strong></p></td><td><p><strong>Con protocolo conjunto</strong></p></td></tr><tr><td><p>PT hace el recorrido sin saber nada del cliente</p></td><td><p>PT sabe el nombre, objetivo y dolor del cliente antes de empezar</p></td></tr><tr><td><p>Recepción ofrece planes sin saber qué vio el PT</p></td><td><p>Recepción sabe qué le gustó, qué dudas tiene y qué perfil tiene</p></td></tr><tr><td><p>El cliente siente que repite su historia dos veces</p></td><td><p>El cliente siente que lo conocen y lo atienden personalizado</p></td></tr><tr><td><p>Cada uno vende por su cuenta</p></td><td><p>Los dos empujan hacia el mismo objetivo</p></td></tr><tr><td><p>Tasa de cierre baja</p></td><td><p>Tasa de cierre alta</p></td></tr></table><h1>2. EL SISTEMA DE TRASPASO — CÓMO FUNCIONA</h1><p><strong>Hay DOS traspasos obligatorios: Recepción → PT antes del recorrido, y PT → Recepción al volver. Ninguno es opcional.</strong></p><h2>Traspaso 1 — Recepción le pasa al PT</h2><p>Antes de que el PT se lleve al cliente al recorrido, recepción le debe pasar 3 datos en voz baja o por WhatsApp:</p><table><tr><td><p><strong>Dato</strong></p></td><td><p><strong>Por qué importa</strong></p></td><td><p><strong>Ejemplo</strong></p></td></tr><tr><td><p>Nombre del cliente</p></td><td><p>El PT lo llama por su nombre desde el primer segundo</p></td><td><p>&quot;Se llama Rodrigo&quot;</p></td></tr><tr><td><p>Objetivo o dolor detectado</p></td><td><p>El PT personaliza el recorrido desde el inicio</p></td><td><p>&quot;Quiere bajar de peso, lleva 2 años sin ir al gym&quot;</p></td></tr><tr><td><p>Señal de compra o duda</p></td><td><p>El PT sabe si está listo o necesita más convencimiento</p></td><td><p>&quot;Está interesado pero le preocupa el precio&quot;</p></td></tr></table><p><strong>📋 TRASPASO: Recepción le dice al PT (en voz baja antes de salir): &quot;Rodrigo, quiere bajar de peso, lleva 2 años sin ir al gym y le preocupa el precio.&quot;</strong></p><h2>Traspaso 2 — PT le pasa a Recepción al volver</h2><p>Al terminar el recorrido, antes de que el cliente llegue al mesón, el PT le pasa a recepción 3 datos:</p><table><tr><td><p><strong>Dato</strong></p></td><td><p><strong>Por qué importa</strong></p></td><td><p><strong>Ejemplo</strong></p></td></tr><tr><td><p>Qué le emocionó del recorrido</p></td><td><p>Recepción lo menciona para reforzar el cierre</p></td><td><p>&quot;Le encantó el área de cardio y los camarines&quot;</p></td></tr><tr><td><p>Qué duda o freno tiene</p></td><td><p>Recepción prepara la respuesta antes de que la diga</p></td><td><p>&quot;Preguntó dos veces por el precio&quot;</p></td></tr><tr><td><p>Qué suplemento recomendó o mencionó</p></td><td><p>Recepción lo ofrece en el momento justo</p></td><td><p>&quot;Le hablé de creatina, está interesado&quot;</p></td></tr></table><p><strong>📋 TRASPASO: PT le dice a recepción (en voz baja o por WhatsApp mientras el cliente se sienta): &quot;Le encantaron los camarines. Preguntó dos veces por el precio — enfócate en el valor por día. Le hablé de creatina.&quot;</strong></p><h1>3. SITUACIONES REALES — CÓMO ACTUAR EN CADA CASO</h1><p><strong>Estos son los escenarios más comunes. Léelos, apréndelos y actúalos naturalmente — no como un script robótico sino como una conversación real.</strong></p><p><strong>  ▶  SITUACIÓN 1 — El cliente llega solo, sin claridad de lo que quiere</strong></p><p>Es el caso más común. El cliente dice &quot;vine a conocer&quot; o &quot;quiero ver qué tienen&quot;. No sabe bien qué busca.</p><p><strong>🔴 RECEPCIÓN: &quot;¿Es la primera vez que nos visitas? Perfecto. Cuéntame, ¿qué te trajo por acá hoy? ¿Tienes algún objetivo en mente o viniste a conocer el lugar?&quot;</strong></p><p>→ El cliente responde vagamente: &quot;quiero ponerme en forma&quot;</p><p><strong>🔴 RECEPCIÓN: &quot;¿Cuándo fue la última vez que entrenaste con regularidad?&quot;</strong></p><p>→ El cliente: &quot;hace como 2 años&quot;</p><p><strong>📋 TRASPASO: Recepción le dice al PT: &quot;Se llama [nombre], quiere ponerse en forma, lleva 2 años parado. Necesita ver que el ambiente es amable y que no va a quedar perdido.&quot;</strong></p><p><strong>🔵 PT: &quot;&quot;Hola [nombre], perfecto que estés volviendo al gym. Acá va gente de todos los niveles — te voy a mostrar exactamente lo que vas a usar cuando empieces. No te voy a mostrar todo, solo lo que te sirve a ti.&quot;&quot;</strong></p><p>→ Durante el recorrido el PT detecta que le gustó la sala de máquinas y que preguntó por los horarios de la mañana.</p><p><strong>📋 TRASPASO: PT le dice a recepción: &quot;Le gustó la sala de máquinas. Preguntó por horarios de mañana — podría interesarle el PAC. Está motivado pero inseguro. No le hables de precio todavía, primero cierra el entusiasmo.&quot;</strong></p><p><strong>🔴 RECEPCIÓN: &quot;&quot;¿Qué te pareció? ¿Te imaginaste entrenando acá? [...] El plan que más eligen las personas que vuelven después de un tiempo es el PAC — funciona automático, no tienes que acordarte de renovar y es el más barato por día. Por menos de $1.200 al día entrenas acá. ¿Lo activamos hoy?&quot;&quot;</strong></p><p><strong>✅ RESULTADO: El cliente cerró PAC Mensual. La recepcionista supo exactamente qué decir porque el PT le dio el dato clave.</strong></p><p><strong>  ▶  SITUACIÓN 2 — El cliente viene con objetivo claro: bajar de peso</strong></p><p>El cliente llega diciendo directamente que quiere bajar de peso. Tiene urgencia pero también inseguridad.</p><p><strong>🔴 RECEPCIÓN: &quot;&quot;¿Cuánto tiempo llevas buscando bajar de peso? ¿Has intentado algo antes — gym, dieta, algo?&quot;&quot;</strong></p><p>→ Cliente: &quot;Sí, he intentado de todo. El problema es que no me mantengo.&quot;</p><p><strong>🔴 RECEPCIÓN: &quot;&quot;¿Y qué te hizo venir hoy específicamente?&quot;&quot;</strong></p><p><strong>📋 TRASPASO: Recepción al PT: &quot;[Nombre] quiere bajar de peso, ha intentado antes y no se mantiene. Su dolor es la constancia. Enfócate en mostrarle que acá es fácil venir y que el ambiente no intimida.&quot;</strong></p><p><strong>🔵 PT: &quot;&quot;[Nombre], lo que más ayuda a mantenerse es tener un ambiente donde te sientas cómodo. Mira — esto es lo que vas a encontrar acá cada vez que vengas...&quot;&quot;</strong></p><p>→ Durante el recorrido el PT menciona creatina y proteína como apoyo para bajar de peso.</p><p><strong>📋 TRASPASO: PT a recepción: &quot;Quiere bajar de peso urgente. Tiene mucha motivación hoy pero su patrón es abandonar. Cierra el PAC con el argumento de que no tiene que decidir renovar cada mes. Le mencioné creatina — está abierto.&quot;</strong></p><p><strong>🔴 RECEPCIÓN: &quot;&quot;El PAC ayuda exactamente con lo que me contaste — no tienes que decidir volver cada mes, se renueva solo. El hábito se construye porque no hay fricción. Y lo puedes cancelar cuando quieras. ¿Lo activamos hoy?&quot;&quot;</strong></p><p>→ Después de cerrar el plan:</p><p><strong>🔴 RECEPCIÓN: &quot;&quot;Por cierto — el PT me contó que mencionaste que quería rés, recepción cosechó con la recomendación exacta.</strong></p><p><strong>  ▶  SITUACIÓN 7 — El cliente miembro activo que compra suplementos</strong></p><p>Un cliente ya inscrito entra a comprar o a entrenar. El PT lo atiende en sala y detecta una oportunidad.</p><p><strong>🔵 PT: &quot;&quot;Oye [nombre], ¿cómo vas con el entrenamiento? ¿Estás tomando algo o vas solo?&quot;&quot;</strong></p><p>→ Cliente: &quot;Solo, nunca he tomado suplementos.&quot;</p><p><strong>🔵 PT: &quot;&quot;Mira, con el objetivo que tienes te vendría muy bien la creatina — yo la uso y la diferencia en recuperación es real. Cuando pases por recepción pregúntales por la Nutriversum, que es la de mejor calidad que tienen.&quot;&quot;</strong></p><p><strong>📋 TRASPASO: PT le avisa a recepción por WhatsApp: &quot;[Nombre] va a pasar por recepción. Interesado en creatina — le recomendé la Nutriversum. Está listo para comprar.&quot;</strong></p><p><strong>🔴 RECEPCIÓN: &quot;&quot;[Nombre], el PT me contó que te recomendó la Nutriversum. Mira — esta tiene sello Creapure, que es la certificación de calidad más exigente del mundo. Fabricada en Alemania, la usan atletas olímpicos. ¿Te la llevo?&quot;&quot;</strong></p><p><strong>✅ RESULTADO: El cliente compró sin resistencia porque ya venía presellado por el PT. La credibilidad del PT hizo el trabajo.</strong></p><p><strong>  ▶  SITUACIÓN 8 — El cliente que &quot;lo va a pensar&quot; y quiere irse</strong></p><p>El cliente terminó el recorrido, escuchó los planes y dice &quot;lo voy a pensar&quot;. Está a punto de irse sin comprar.</p><p>→ Recepción no logra cerrar. Hace una seña discreta al PT.</p><p><strong>🔵 PT: &quot;&quot;[Nombre], ¿cómo te fue? ¿Qué te pareció?&quot;&quot;</strong></p><p>→ Cliente: &quot;Muy bien, me gustó mucho. Lo voy a pensar.&quot;</p><p><strong>🔵 PT: &quot;&quot;Entiendo. ¿Hay algo específico que te genera duda? A veces uno se va a pensar y después no vuelve — y al final pierde la motivación que tenía hoy.&quot;&quot;</st a evaluación gratis no es un regalo — es una inversión. Cuando el PT pasa 20 minutos con el cliente tomándole medidas y analizando su cuerpo, pasan tres cosas clave:</p><ul><li>El cliente percibe un nivel de atención y profesionalismo que no esperaba — eso genera confianza y lealtad</li><li>El PT detecta necesidades específicas que solo se ven en ese contexto íntimo: lesiones, desbalances, zonas problemáticas, hábitos</li><li>Al final de la evaluación, el PT tiene toda la información para hacer una recomendación de personalizado que el cliente siente que está hecha exactamente para él</li></ul><p><strong>La evaluación antropométrica es la puerta de entrada al entrenamiento personalizado. Sin excepción, al terminar cada evaluación el PT debe hacer la oferta de EP.</strong></p><h2>3.3 Cómo ofrecer la evaluación — Script PT</h2><p><strong>🔵 PT: &quot;Oye, como tienes plan activo tienes derecho a una evaluación antropométrica gratis. Son 20 minutos donde te tomo todas las medidas, analizamos cómo está tu cuerpo hoy y te explico exactamente qué necesitas trabajar para llegar a tu objetivo. ¿Cuándo tienes tiempo esta semana?&quot;</strong></p><p>→ Para clientes nuevos que acaban de inscribirse:</p><p><strong>🔵 PT: &quot;Perfecto que empiezas hoy. Lo primero que hacemos antes de que entres a sala es la evaluación — así sabemos exactamente desde dónde partes y cómo adaptar el entrenamiento para ti. No te va a quitar más de 20 minutos. ¿Lo hacemos ahora o prefieres volver mañana?&quot;</strong></p><h2>3.4 Durante la evaluación — qué preguntar</h2><p>La evaluación no es solo tomar medidas. Es una conversación de diagnóstico. Estas preguntas son clave:</p><table><tr><td><p><strong>Pregunta</strong></p></td><td><p><strong>Qué detectas</strong></p></td></tr><tr><td><p>&quot;¿Tienes alguna lesión o dolor recurrente?&quot;</p></td><td><p>Necesidad de EP con enfoque correctivo — argumento de venta directo</p></td></tr><tr><td><p>&quot;¿Cuántas veces a la semana puedes venir?&quot;</p></td><td><p>Define la intensidad del programa personalizado a proponer</p></td></tr><tr><td><p>&quot;¿Has entrenado con alguien antes o siempre solo?&quot;</p></td><td><p>Si fue solo y no vio resultados, el EP es la solución obvia</p></td></tr><tr><td><p>&quot;¿Tienes fecha límite para llegar a tu objetivo?&quot;</p></td><td><p>Una fecha crea urgencia — el EP acelera el proceso</p></td></tr><tr><td><p>&quot;¿Qué es lo que más te cuesta cuando entrenas?&quot;</p></td><td><p>Detecta el freno específico que el EP puede resolver</p></td></tr><tr><td><p>&quot;¿Qué suplementos estás tomando?&quot;</p></td><td><p>Abre la conversación de suplementos y máquina expendedora</p></td></tr></table><h2>3.5 Cierre de la evaluación — oferta de EP</h2><p>Al terminar las medidas, el PT siempre cierra con esta secuencia:</p><p><strong>🔵 PT: &quot;Bueno, mirando todo esto lo que más te conviene trabajar es [zona/objetivo específico]. Con el entrenamiento que estás haciendo solo vas a llegar, pero va a tomar más tiempo y hay riesgo de que trabajes mal [zona]. Lo que yo te recomendaría es empezar con un paquete de sesiones personalizadas — te diseño el programa exacto para tu cuerpo, te enseño la técnica correcta y hacemos seguimiento real. ¿Te interesa saber cómo funciona?&quot;</strong></p><p>→ Si pregunta el precio:</p><p><strong>🔵 PT: &quot;Tenemos diferentes opciones según la frecuencia que quieras. Lo más inteligente para empezar son 8 sesiones — así tenemos tiempo para enseñarte bien la técnica y ver los primeros resultados. Son $128.000 y se hace fuera del horario de mi trabajo en sala ¿Cuándo podrías empezar?&quot;</strong></p><h2>3.6 Máquina expendedora de proteína — integración en la evaluación</h2><p>Al terminar la evaluación, si el cliente mencionó suplementos o mostró interés, el PT lo lleva directamente a la máquina expendedora.</p><p><strong>🔵 PT: &quot;Antes de que entres a entrenar, te quiero mostrar algo. Tenemos una máquina donde puedes probar la proteína por scoop individual — así sabes exactamente qué sabor te gusta antes de comprar el tarro completo. El gramo de proteína vale $85 y el de pre-entreno $100. ¿Le damos una prueba?&quot;</strong></p><p><strong>La lógica es simple: quien prueba y le gusta, compra el tarro. La máquina expendedora no es solo venta directa — es la mejor demostración de producto que existe.</strong></p><h1>4. ENTRENAMIENTO PERSONALIZADO — PROTOCOLO DE VENTA</h1><h2>4.1 Precios y modalidades</h2><table><tr><td><p><strong>Modalidad</strong></p></td><td><p><strong>4 sesiones</strong></p></td><td><p><strong>8 sesiones</strong></p></td><td><p><strong>12 sesiones</strong></p></td><td><p><strong>16 sesiones</strong></p></td><td><p><strong>20 sesiones</strong></p></td></tr><tr><td><p>1 a 1 (precio/sesión)</p></td><td><p>$72.000 ($18.000)</p></td><td><p>$128.000 ($16.000)</p></td><td><p>$160.000 ($13.333)</p></td><td><p>$190.000 ($11.875)</p></td><td><p>$230.000 ($11.500)</p></td></tr><tr><td><p>2 es a 1 (precio/sesión)</p></td><td><p>$120.000 ($15.000)</p></td><td><p>$128.000 ($12.000)</p></td><td><p>$216.000 ($9.000)</p></td><td><p>$256.000 ($8.000)</p></td><td><p>$300.000 ($7.500)</p></td></tr><tr><td><p>3 es a 1 (precio/sesión)</p></td><td><p>$150.000 ($12.500)</p></td><td><p>$228.000 ($19.500)</p></td><td><p>$252.000 ($7.000)</p></td><td><p>$312.000 ($6.500)</p></td><td><p>$360.000 ($6.000)</p></td></tr></table><p><strong>El PT se lleva el 80% y el gym el 20%. Las sesiones se hacen fuera del horario de trabajo normal del PT — son ingresos adicionales para él. Eso es motivación real para vender.</strong></p><h2>4.2 Cómo elegir qué modalidad ofrecer primero</h2><table><tr><td><p><strong>Perfil del cliente</strong></p></td><td><p><strong>Modalidad a ofrecer</strong></p></td><td><p><strong>Por qué</strong></p></td></tr><tr><td><p>Principiante solo, objetivo general</p></td><td><p>1 a 1</p></td><td><p>Necesita atención individual para aprender bien</p></td></tr><tr><td><p>Pareja o dos amigos con objetivo similar</p></td><td><p>2 es a 1</p></td><td><p>Precio más accesible, se motivan juntos</p></td></tr><tr><td><p>Grupo de 3 amigos o familia</p></td><td><p>3 es a 1</p></td><td><p>El precio por sesión baja mucho — más fácil de vender</p></td></tr><tr><td><p>Cliente con lesión o condición especial</p></td><td><p>1 a 1 siempre</p></td><td><p>Requiere atención individual sin excepción</p></td></tr><tr><td><p>Cliente con poco presupuesto</p></td><td><p>2 es a 1 o 3 es a 1</p></td><td><p>El precio por sesión baja considerablemente</p></td></tr><tr><td><p>Cliente con fecha límite (boda, verano)</p></td><td><p>1 a 1 paquete grande</p></td><td><p>Necesita máxima frecuencia e intensidad personalizada</p></td></tr></table><h2>4.3 Script de venta — PT (después de evaluación)</h2><p><strong>🔵 PT: &quot;Con todo lo que vimos en la evaluación, lo que más te va a ayudar a llegar a [objetivo] es trabajar con un programa personalizado. Te diseño la rutina exacta, te enseño la técnica correcta para cada ejercicio y hacemos seguimiento cada semana. La mayoría de las personas que van solas pierden los primeros 3 meses aprendiendo — con el personalizado llegás al resultado en la mitad del tiempo y sin riesgo de lesión. ¿Empezamos con 8 sesiones?&quot;</strong></p><p>→ Si viene con alguien (pareja o amigo):</p><p><strong>🔵 PT: &quot;¿Vienen a entrenar juntos? Perfecto — tenemos la opción de personalizado 2 es a 1 donde los dos trabajan conmigo al mismo tiempo. El precio por sesión baja bastante y además se motivan mutuamente. Son $128.000 por 8 sesiones — $64.000 cada uno. ¿Lo hacemos?&quot;</strong></p><h2>4.4 Script de venta — Recepción</h2><p><strong>🔴 RECEPCIÓN: &quot;¿Sabías que tenemos entrenamiento personalizado con nuestros profesores? Es aparte del plan y se hace en el horario que te acomode. Si es tu primera vez en el gym o llevas tiempo sin ver resultados, es la forma más inteligente de empezar — el profe te diseña el programa exacto para tu objetivo. ¿Te interesa que te cuente más?&quot;</strong></p><p>→ Si el cliente dice que no tiene plata:</p><p><strong>🔴 RECEPCIÓN: &quot;Entiendo. Por eso también tenemos la opción grupal — si tienes un amigo o tu pareja que quiera entrenar contigo, el personalizado 2 es a 1 sale a $64.000 por persona por 8 sesiones. Mucho más accesible. ¿Conoces a alguien que pudiera interesarle?&quot;</strong></p><h2>4.5 Objeciones frecuentes</h2><table><tr><td><p><strong>Objeción</strong></p></td><td><p><strong>Respuesta</strong></p></td></tr><tr><td><p>&quot;¿No puedo ir solo?&quot;</p></td><td><p>&quot;Puedes, claro. Pero los primeros 3 meses solo son los que más se desperdician aprendiendo a prueba y error. Con el personalizado llegas al resultado en la mitad del tiempo y sin lesionarte.&quot;</p></td></tr><tr><td><p>&quot;Es muy caro&quot;</p></td><td><p>&quot;Mirémoslo así — son $16.000 por sesión en el paquete de 8. Eso es menos que una consulta médica, y el resultado que vas a conseguir en 8 semanas con programa personalizado no lo logras en 6 meses solo.&quot;</p></td></tr><tr><td><p>&quot;Lo pienso y te aviso&quot;</p></td><td><p>&quot;Claro. Solo te cuento que la agenda del profe se llena — si quieres empezar este mes, mejor lo reservamos hoy. ¿Cuándo te acomoda empezar?&quot;</p></td></tr><tr><td><p>&quot;¿Qué diferencia hay con ir solo?&quot;</p></td><td><p>&quot;La diferencia es que con el personalizado tienes un programa hecho para tu cuerpo, técnica correcta desde el día 1, y alguien que hace seguimiento real de tu progreso. Sin eso, entrenas pero no progresas de forma óptima.&quot;</p></td></tr><tr><td><p>&quot;¿Y si no me gusta el profe?&quot;</p></td><td><p>&quot;Los profesores son excelentes y si en las primeras sesiones sientes que no es la conexión correcta, lo conversamos y buscamos la mejor solución.&quot;</p></td></tr></table><h1>5. NUTRICIONISTA — PROTOCOLO DE DERIVACIÓN</h1><h2>5.1 Qué ofrece</h2><p>La nutricionista atiende con cita previa. La consulta cuesta $35.000 e incluye el Inbody, sin inbody cuesta 28.000. La nutricionista se lleva el 60% y el gym el 20%. No hay comisión adicional para PT ni recepción — pero cada derivación genera un cliente más comprometido con el gym.</p><p><strong>Aunque no hay comisión directa, derivar a la nutricionista fideliza al cliente. Un cliente que está trabajando su alimentación tiene mucho menos probabilidad de abandonar el gym.</strong></p><h2>5.2 Cuándo derivar — señales clave</h2><table><tr><td><p><strong>El cliente menciona...</strong></p></td><td><p><strong>Ofreces nutricionista porque...</strong></p></td></tr><tr><td><p>&quot;Entreno pero no bajo de peso&quot;</p></td><td><p>El problema casi siempre es la alimentación, no el entrenamiento</p></td></tr><tr><td><p>&quot;Quiero ganar músculo pero no sé qué comer&quot;</p></td><td><p>La dieta es el 70% del resultado muscular</p></td></tr><tr><td><p>&quot;Tengo diabetes/presión/colesterol&quot;</p></td><td><p>Necesita plan nutricional adaptado a su condición</p></td></tr><tr><td><p>&quot;Como mal y lo sé&quot;</p></td><td><p>La nutricionista le da el plan concreto que necesita</p></td></tr><tr><td><p>&quot;¿Qué suplementos tomo?&quot;</p></td><td><p>La nutricionista puede recomendarlos en contexto de alimentación</p></td></tr><tr><td><p>&quot;Quiero resultados más rápidos&quot;</p></td><td><p>Combinar gym + nutrición acelera los resultados notablemente</p></td></tr></table><h2>5.3 Script de derivación — PT</h2><p><strong>🔵 PT: &quot;Con el objetivo que tienes, el entrenamiento es una parte — pero la alimentación es el 70% del resultado. Nosotros tenemos nutricionista que atiende acá en el gym con cita previa. La consulta incluye el Inbody y ella te diseña el plan exacto para tu objetivo. Son $35.000 y la diferencia en resultados es notable. ¿Quieres que te agendemos una hora?&quot;</strong></p><h2>5.4 Script de derivación — Recepción</h2><p><strong>🔴 RECEPCIÓN: &quot;¿Sabes que tenemos nutricionista? Atiende acá en el gym — la consulta incluye el Inbody y te diseña un plan de alimentación específico para tu objetivo. Son $35.000 la sesión y muchos de nuestros clientes dicen que fue lo que marcó la diferencia real en sus resultados. ¿Te agendo una hora?&quot;</strong></p><h2>5.5 Objeciones frecuentes</h2><table><tr><td><p><strong>Objeción</strong></p></td><td><p><strong>Respuesta</strong></p></td></tr><tr><td><p>&quot;Ya sé cómo comer bien&quot;</p></td><td><p>&quot;Claro, pero hay diferencia entre saber en general y tener un plan exacto para tu cuerpo y tu objetivo. La nutricionista ajusta las cantidades, los horarios y los alimentos a lo que tú específicamente necesitas.&quot;</p></td></tr><tr><td><p>&quot;Es caro&quot;</p></td><td><p>&quot;Son $35.000 e incluye el Inbody — que solo cuesta $20.000. Así que prácticamente pagas $15.000 por el plan nutricional. Vale la pena.&quot;</p></td></tr><tr><td><p>&quot;Lo hago solo con suplementos&quot;</p></td><td><p>&quot;Los suplementos apoyan, pero no reemplazan la alimentación. Con la nutricionista sabes exactamente qué comer, en qué cantidades y a qué hora — los suplementos encima de eso multiplican el efecto.&quot;</p></td></tr></table><h1>6. MÁQUINA EXPENDEDORA — PROTOCOLO DE PRUEBA Y VENTA</h1><h2>6.1 Cómo funciona</h2><p>La máquina vende proteína a $85 el gramo y pre-entreno a $100 el gramo. El objetivo no es solo vender por scoop — es que el cliente pruebe el sabor, le guste, y después compre el tarro completo. Es la mejor demostración de producto que existe.</p><table><tr><td><p><strong>Producto</strong></p></td><td><p><strong>Precio por gramo</strong></p></td><td><p><strong>Scoop promedio</strong></p></td><td><p><strong>Precio aprox. por prueba</strong></p></td></tr><tr><td><p>Proteína en polvo</p></td><td><p>$85/gr</p></td><td><p>30 gr</p></td><td><p>~$2.550</p></td></tr><tr><td><p>Pre-entreno</p></td><td><p>$100/gr</p></td><td><p>10-15 gr</p></td><td><p>~$1.000-$1.500</p></td></tr></table><h2>6.2 Cuándo llevar al cliente a la máquina</h2><ul><li>Después de la evaluación antropométrica — el PT la recomienda como primer paso</li><li>Cuando el cliente dice &quot;nunca he tomado suplementos&quot; — la prueba elimina la barrera de no saber qué elegir</li><li>Cuando duda entre sabores o marcas — &quot;pruébalo primero y después decides&quot;</li><li>Después de una sesión de entrenamiento — el cliente está en el momento exacto donde la proteína tiene más sentido</li></ul><h2>6.3 Script PT — llevar a la máquina</h2><p><strong>🔵 PT: &quot;Antes de que te vayas, te quiero mostrar algo. Muchos clientes no compran proteína porque no saben qué sabor les va a gustar. Acá puedes probar por scoop individual — son como $2.500 por una porción completa. Así sabes exactamente qué te gusta antes de invertir en el tarro. ¿Le damos una prueba?&quot;</strong></p><h2>6.4 Script Recepción — cerrar la venta del tarro</h2><p><strong>🔴 RECEPCIÓN: &quot;¿Probaste la proteína en la máquina? ¿Cómo te pareció el sabor? Si te gustó, el tarro completo te sale mucho más económico por gramo — y lo tienes disponible en la vitrina ahora mismo. ¿Lo llevamos?&quot;</strong></p><p><strong>La secuencia ideal: PT lleva al cliente a la máquina → cliente prueba → PT o Recepción cierra la venta del tarro. La prueba hace el 80% del trabajo.</strong></p><h1>7. PROTOCOLO CONJUNTO — SITUACIONES REALES</h1><p><strong>  ▶  SITUACIÓN A — Cliente nuevo que no sabe por dónde empezar</strong></p><p>El cliente llega por primera vez. Dice que quiere &quot;ponerse en forma&quot; pero no tiene claridad.</p><p><strong>🔴 RECEPCIÓN: &quot;&quot;Perfecto que estás aquí. Antes de hablar de planes, hagamos algo — tenemos una evaluación gratuita donde el profe te toma las medidas y te dice exactamente dónde estás hoy. Así el plan que elijas tiene sentido real. ¿Lo hacemos?&quot;&quot;</strong></p><p><strong>📋 TRASPASO: Recepción → PT: &quot;[Nombre], primera vez, quiere ponerse en forma. Sin claridad de objetivo. Hazle la evaluación antropométrica y detecta qué necesita.&quot;</strong></p><p><strong>🔵 PT: &quot;[Durante evaluación] &quot;Mirando tus medidas, lo que más necesitas trabajar es [zona]. Con el programa que tienes pensado ir solo, vas a llegar pero te va a costar más tiempo. Te propongo empezar con 8 sesiones de personalizado — te diseño todo y en 2 meses ves resultados reales.&quot;&quot;</strong></p><p>→ PT lleva al cliente a la máquina expendedora antes de ir a recepción.</p><p><strong>🔵 PT: &quot;&quot;Prueba esta proteína — así sabes qué sabor te gusta antes de comprar el tarro.&quot;&quot;</strong></p><p><strong>📋 TRASPASO: PT → Recepción: &quot;[Nombre] listo. Quiere el personalizado 1a1 de 8 sesiones + el tarro de proteína que probó en la máquina. Cierra el PAC + personalizado + proteína.&quot;</strong></p><p><strong>✅ RESULTADO: Una sola visita generó PAC + personalizado 8 sesiones + proteína. La evaluación gratis fue la puerta de entrada a todo.</strong></p><p><strong>  ▶  SITUACIÓN B — Cliente que lleva meses entrenando sin ver resultados</strong></p><p>El cliente ya tiene plan activo pero está frustrado porque no ve cambios.</p><p><strong>🔴 RECEPCIÓN: &quot;&quot;¿Cuánto tiempo llevas entrenando? ¿Has notado cambios? [...] Mira, puede estar pasando algo que no se ve a simple vista — el Inbody en 5 minutos te dice exactamente si estás perdiendo grasa o ganando músculo aunque la ropa se sienta igual. ¿Lo hacemos?&quot;&quot;</strong></p><p>→ Hacen el Inbody. Se detecta que tiene buena base muscular pero el porcentaje de grasa no bajó.</p><p><strong>📋 TRASPASO: Recepción → PT: &quot;[Nombre] con plan activo, frustrado por falta de resultados. Hizo el Inbody — buena masa muscular pero grasa sin bajar. Probablemente problema de alimentación + técnica.&quot;</strong></p><p><strong>🔵 PT: &quot;&quot;Mirando tu Inbody, el problema no es el entrenamiento — es que tu cuerpo está en modo mantenimiento. Con algunos ajustes en la técnica y la intensidad podemos cambiar eso. Te propongo 8 sesiones de personalizado para re-calibrar todo. Y también te recomendaría ver a nuestra nutricionista — el 70% del resultado está en la comida.&quot;&quot;</strong></p><p><strong>📋 TRASPASO: PT → Recepción: &quot;[Nombre] interesado en personalizado + nutricionista. Cierra 8 sesiones 1a1 y agenda la nutricionista.&quot;</strong></p><p><strong>✅ RESULTADO: Cliente frustrado se convirtió en cliente comprometido con Inbody + personalizado + nutricionista. El Inbody reveló el problema real.</strong></p><p><strong>  ▶  SITUACIÓN C — Pareja o amigos que vienen juntos</strong></p><p>Dos personas llegan juntas. Uno quiere ganar músculo, el otro bajar de peso.</p><p><strong>🔴 RECEPCIÓN: &quot;&quot;¿Vienen los dos a inscribirse? Perfecto — hay una opción que les va a interesar mucho. Tenemos personalizado 2 es a 1 donde trabajan con el mismo profe al mismo tiempo pero con programas individuales para cada uno. El precio por sesión baja bastante.&quot;&quot;</strong></p><p><strong>📋 TRASPASO: Recepción → PT: &quot;Vienen juntos. Uno quiere músculo, el otro bajar de peso. Ofréceles la evaluación antropométrica a los dos y cierra el 2 es a 1.&quot;</strong></p><p><strong>🔵 PT: &quot;[Hace evaluación a los dos por separado] &quot;Perfecto — tienen objetivos distintos pero pueden entrenar juntos. Los programo diferente para cada uno pero la sesión la hacemos juntos. Son $128.000 por 8 sesiones — $64.000 cada uno. ¿Empezamos?&quot;&quot;</strong></p><p>→ PT los lleva a la máquina expendedora.</p><p><strong>🔵 PT: &quot;&quot;Prueben la proteína — así saben qué sabor les gusta a cada uno antes de llevarse el tarro.&quot;&quot;</strong></p><p><strong>✅ RESULTADO: Dos PAC + 2es a 1 de 8 sesiones + dos tarros de proteína. El 2es a 1 convirtió el precio en un argumento a favor.</strong></p><p><strong>  ▶  SITUACIÓN D — Cliente que quiere resultados rápidos con fecha límite</strong></p><p>El cliente dice que tiene una boda, vacaciones o evento en 3 meses y quiere resultados rápidos.</p><p><strong>🔴 RECEPCIÓN: &quot;&quot;Con 3 meses tienes tiempo suficiente para ver un cambio real — pero necesitas un plan concreto, no improvisar. Lo primero es saber exactamente desde dónde partes. ¿Hacemos el Inbody ahora?&quot;&quot;</strong></p><p>→ Hacen el Inbody. El resultado da el diagnóstico exacto.</p><p><strong>📋 TRASPASO: Recepción → PT: &quot;[Nombre] tiene [evento] en 3 meses. Hizo el Inbody — tiene [dato específico]. Necesita resultado rápido. Ofrécele el personalizado 1a1 paquete grande y la nutricionista.&quot;</strong></p><p><strong>🔵 PT: &quot;&quot;Con 3 meses y tu diagnóstico de Inbody, lo más inteligente es 16 sesiones de personalizado — así tenemos tiempo para hacer una progresión real y llegar al resultado que quieres. Y te recomendaría también ver a nuestra nutricionista — la alimentación va a determinar el 70% de lo que logres en estos 3 meses.&quot;&quot;</strong></p><p><strong>✅ RESULTADO: Inbody + personalizado 16 sesiones + nutricionista. La fecha límite creó la urgencia — el equipo la aprovechó correctamente.</strong></p><p><strong>  ▶  SITUACIÓN E — Miembro activo que entrena solo y está estancado</strong></p><p>El PT lo ve en sala con técnica incorrecta o sin progresión visible.</p><p><strong>🔵 PT: &quot;&quot;Oye [nombre], ¿cómo vas con el entrenamiento? [...] Te doy una observación — esa técnica en [ejercicio] te está limitando. Si quieres, te propongo hacerte la evaluación antropométrica gratis que te corresponde como miembro — en 20 minutos revisamos todo y te doy recomendaciones concretas. ¿Cuándo tienes tiempo?&quot;&quot;</strong></p><p>→ Hace la evaluación. Detecta el problema real.</p><p><strong>🔵 PT: &quot;&quot;Mirando todo, el estancamiento que sientes es normal después de [X meses] — tu cuerpo se adaptó. Con 8 sesiones de personalizado re-programamos el estímulo y en un mes ya notas la diferencia. ¿Cuándo empezamos?&quot;&quot;</strong></p><p><strong>📋 TRASPASO: PT → Recepción: &quot;[Nombre] va a pagar personalizado 8 sesiones 1a1. Ya cerrado.&quot;</strong></p><p><strong>✅ RESULTADO: Miembro activo que estaba a punto de abandonar por frustración se convirtió en cliente de EP. El PT lo rescató desde sala.</strong></p><h1>8. REGLAS DE ORO DE SERVICIOS PREMIUM</h1><table><tr><td><p><strong>#</strong></p></td><td><p><strong>Regla</strong></p></td></tr><tr><td><p>1</p></td><td><p>La evaluación antropométrica gratis siempre termina con oferta de EP. Sin excepción.</p></td></tr><tr><td><p>2</p></td><td><p>El Inbody se ofrece ANTES de hablar de planes con clientes indecisos — convierte dudas en decisiones.</p></td></tr><tr><td><p>3</p></td><td><p>La máquina expendedora es el paso previo a vender el tarro — nunca al revés.</p></td></tr><tr><td><p>4</p></td><td><p>La nutricionista se ofrece siempre que el cliente mencione alimentación, peso o falta de resultados.</p></td></tr><tr><td><p>5</p></td><td><p>Para grupos de 2 o 3 personas, el 2es a 1 o 3es a 1 siempre es más fácil de cerrar que el 1a1.</p></td></tr><tr><td><p>6</p></td><td><p>Una fecha límite (boda, verano) es el mejor argumento para cerrar paquetes grandes de EP.</p></td></tr><tr><td><p>7</p></td><td><p>PT y Recepción se pasan el dato del servicio vendido o derivado para mantener el seguimiento.</p></td></tr><tr><td><p>8</p></td><td><p>Aunque no hay comisión por derivar a la nutricionista, cada derivación fideliza al cliente al gym.</p></td></tr></table><p><em>Gym Factory · Membrillar 266, Rancagua</em></p>', label: 'Servicios Premium' },
  tarjeta_recepcion: { type: 'html', data: '<!DOCTYPE html>\n<!-- saved from url=(0063)file:///C:/Users/Usuario/Downloads/tarjeta_recepcion%20(1).html -->\n<html lang="es"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">\n\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>Tarjeta Recepción — Gym Factory</title>\n<link href="./Tarjeta Recepción — Gym Factory_files/css2" rel="stylesheet">\n<style>\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  body { font-family: \'DM Sans\', sans-serif; background: #f0f0f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }\n\n  .page {\n    width: 210mm;\n    min-height: 297mm;\n    background: #0D0D0D;\n    color: #fff;\n    padding: 10mm 10mm;\n    display: grid;\n    grid-template-rows: auto auto 1fr auto;\n    gap: 5mm;\n    position: relative;\n    overflow: hidden;\n  }\n\n  /* BG accent */\n  .page::before {\n    content: \'\';\n    position: absolute;\n    top: -40px; right: -40px;\n    width: 200px; height: 200px;\n    background: radial-gradient(circle, rgba(192,57,43,0.3) 0%, transparent 70%);\n    pointer-events: none;\n  }\n\n  /* HEADER */\n  .header {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    border-bottom: 2px solid #C0392B;\n    padding-bottom: 4mm;\n  }\n  .brand { font-family: \'Bebas Neue\', sans-serif; font-size: 28px; letter-spacing: 3px; color: #C0392B; }\n  .role-badge {\n    background: #C0392B;\n    color: #fff;\n    font-family: \'Bebas Neue\', sans-serif;\n    font-size: 18px;\n    letter-spacing: 2px;\n    padding: 4px 14px;\n    border-radius: 3px;\n  }\n\n  /* SECTIONS */\n  .section { margin-bottom: 3mm; }\n  .section-title {\n    font-family: \'Bebas Neue\', sans-serif;\n    font-size: 13px;\n    letter-spacing: 3px;\n    color: #C0392B;\n    margin-bottom: 2mm;\n    text-transform: uppercase;\n  }\n\n  /* FLUJO */\n  .flujo {\n    display: flex;\n    align-items: stretch;\n    gap: 0;\n  }\n  .flujo-step {\n    flex: 1;\n    background: #1A1A1A;\n    border: 1px solid #2C2C2C;\n    padding: 5px 6px;\n    text-align: center;\n    position: relative;\n    font-size: 10px;\n    line-height: 1.3;\n  }\n  .flujo-step:not(:last-child)::after {\n    content: \'▶\';\n    position: absolute;\n    right: -8px;\n    top: 50%;\n    transform: translateY(-50%);\n    color: #C0392B;\n    font-size: 10px;\n    z-index: 1;\n  }\n  .flujo-num {\n    font-family: \'Bebas Neue\', sans-serif;\n    font-size: 18px;\n    color: #C0392B;\n    display: block;\n  }\n  .flujo-label { color: #ccc; font-size: 9px; font-weight: 600; }\n\n  /* PREGUNTAS */\n  .preguntas { display: grid; grid-template-columns: 1fr 1fr; gap: 2mm; }\n  .pregunta {\n    background: #1A1A1A;\n    border-left: 3px solid #C0392B;\n    padding: 5px 8px;\n    font-size: 10px;\n    line-height: 1.4;\n  }\n  .pregunta-num { color: #C0392B; font-weight: 700; font-size: 9px; text-transform: uppercase; letter-spacing: 1px; }\n  .pregunta-text { color: #fff; margin-top: 1px; font-style: italic; }\n  .pregunta-para { color: #aaa; font-size: 9px; margin-top: 2px; }\n\n  /* ARBOL */\n  .arbol { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2mm; }\n  .arbol-item {\n    background: #1A1A1A;\n    border: 1px solid #2C2C2C;\n    border-top: 2px solid #C0392B;\n    padding: 5px 7px;\n    font-size: 9px;\n    line-height: 1.4;\n  }\n  .arbol-si { color: #C0392B; font-weight: 700; font-size: 9px; text-transform: uppercase; }\n  .arbol-dice { color: #aaa; font-size: 9px; font-style: italic; margin: 1px 0; }\n  .arbol-ofrece { color: #fff; font-weight: 600; font-size: 9px; }\n  .arbol-extra { color: #1D9E75; font-size: 8px; margin-top: 1px; }\n\n  /* SCRIPTS */\n  .scripts { display: flex; flex-direction: column; gap: 2mm; }\n  .script-item {\n    background: #1A1A1A;\n    border-left: 3px solid #2980B9;\n    padding: 5px 8px;\n    font-size: 9.5px;\n    line-height: 1.4;\n  }\n  .script-label { color: #2980B9; font-weight: 700; font-size: 8px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }\n  .script-text { color: #ddd; font-style: italic; }\n\n  /* SUPLEMENTOS */\n  .supl-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2mm; }\n  .supl-item {\n    background: #1A1A1A;\n    border: 1px solid #2C2C2C;\n    padding: 4px 6px;\n    font-size: 8.5px;\n    line-height: 1.3;\n  }\n  .supl-perfil { color: #C0392B; font-weight: 700; font-size: 8px; text-transform: uppercase; letter-spacing: 0.5px; }\n  .supl-prod { color: #fff; margin-top: 1px; }\n  .supl-comp { color: #1D9E75; font-size: 8px; }\n\n  /* OBJECIONES */\n  .obj-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2mm; }\n  .obj-item {\n    background: #1A1A1A;\n    border: 1px solid #2C2C2C;\n    padding: 4px 7px;\n    font-size: 9px;\n    line-height: 1.3;\n  }\n  .obj-q { color: #EF9F27; font-style: italic; font-size: 8.5px; }\n  .obj-a { color: #ccc; font-size: 8.5px; margin-top: 2px; }\n\n  /* COMISIONES */\n  .comisiones {\n    display: grid;\n    grid-template-columns: repeat(4, 1fr);\n    gap: 2mm;\n  }\n  .com-item {\n    background: #1A1A1A;\n    border: 1px solid #2C2C2C;\n    padding: 4px 6px;\n    text-align: center;\n    font-size: 8.5px;\n  }\n  .com-tipo { color: #aaa; font-size: 8px; }\n  .com-monto { font-family: \'Bebas Neue\', sans-serif; font-size: 16px; color: #1D9E75; }\n\n  /* REGLAS */\n  .reglas {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 1.5mm;\n  }\n  .regla {\n    display: flex;\n    gap: 5px;\n    align-items: flex-start;\n    font-size: 9px;\n    line-height: 1.3;\n    color: #ccc;\n  }\n  .regla-num {\n    font-family: \'Bebas Neue\', sans-serif;\n    color: #C0392B;\n    font-size: 13px;\n    min-width: 14px;\n    line-height: 1;\n  }\n\n  /* FOOTER */\n  .footer {\n    border-top: 1px solid #2C2C2C;\n    padding-top: 2mm;\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    font-size: 8px;\n    color: #444;\n  }\n\n  @media print {\n    body { background: #fff; padding: 0; margin: 0; }\n    .page { width: 210mm; min-height: 297mm; margin: 0; }\n  }\n</style>\n</head>\n<body>\n<div class="page">\n\n  <!-- HEADER -->\n  <div class="header">\n    <div>\n      <div class="brand">GYM FACTORY</div>\n      <div style="font-size:9px;color:#666;letter-spacing:2px;text-transform:uppercase">Fitness, el lujo de la nueva era</div>\n    </div>\n    <div class="role-badge">RECEPCIÓN</div>\n  </div>\n\n  <!-- FLUJO -->\n  <div class="section">\n    <div class="section-title">El flujo obligatorio — cada visita nueva</div>\n    <div class="flujo">\n      <div class="flujo-step"><span class="flujo-num">1</span><div class="flujo-label">Bienvenida</div></div>\n      <div class="flujo-step"><span class="flujo-num">2</span><div class="flujo-label">2 Preguntas</div></div>\n      <div class="flujo-step"><span class="flujo-num">3</span><div class="flujo-label">Recorrido PT</div></div>\n      <div class="flujo-step"><span class="flujo-num">4</span><div class="flujo-label">Máx. 2 planes</div></div>\n      <div class="flujo-step"><span class="flujo-num">5</span><div class="flujo-label">Cierre / Matrícula</div></div>\n      <div class="flujo-step"><span class="flujo-num">6</span><div class="flujo-label">Contacto + Follow</div></div>\n    </div>\n  </div>\n\n  <!-- PREGUNTAS -->\n  <div class="section">\n    <div class="section-title">Las 2 preguntas de diagnóstico</div>\n    <div class="preguntas">\n      <div class="pregunta">\n        <div class="pregunta-num">Pregunta 1 — Motivación</div>\n        <div class="pregunta-text">"¿Qué te trajo por acá? ¿Tienes algún objetivo en mente?"</div>\n        <div class="pregunta-para">→ Detecta el dolor que tienes que atacar</div>\n      </div>\n      <div class="pregunta">\n        <div class="pregunta-num">Pregunta 2 — Compromiso</div>\n        <div class="pregunta-text">"¿Buscas algo constante o prefieres probar primero?"</div>\n        <div class="pregunta-para">→ Define si ofreces PAC o pase diario</div>\n      </div>\n    </div>\n  </div>\n\n  <!-- ARBOL DE DECISION PLANES -->\n  <div class="section">\n    <div class="section-title">Árbol de decisión — qué plan ofrecer</div>\n    <div class="arbol">\n      <div class="arbol-item">\n        <div class="arbol-si">Quiere constancia</div>\n        <div class="arbol-dice">Adulto con trabajo estable</div>\n        <div class="arbol-ofrece">→ PAC Mensual $34.990</div>\n        <div class="arbol-extra">+ Semestral si tiene presupuesto</div>\n      </div>\n      <div class="arbol-item">\n        <div class="arbol-si">Es estudiante</div>\n        <div class="arbol-dice">Joven con carnet vigente</div>\n        <div class="arbol-ofrece">→ PAC Estudiante $29.990</div>\n        <div class="arbol-extra">+ PAC Mensual si no tiene carnet</div>\n      </div>\n      <div class="arbol-item">\n        <div class="arbol-si">Quiere probar</div>\n        <div class="arbol-dice">"No sé si voy a ir seguido"</div>\n        <div class="arbol-ofrece">→ Pase diario $6.990</div>\n        <div class="arbol-extra">+ Inscripción esta semana sin matrícula</div>\n      </div>\n      <div class="arbol-item">\n        <div class="arbol-si">Quiere invertir</div>\n        <div class="arbol-dice">Tiene presupuesto, seguro</div>\n        <div class="arbol-ofrece">→ Semestral $182.990</div>\n        <div class="arbol-extra">+ Anual $305.990 si puede</div>\n      </div>\n      <div class="arbol-item">\n        <div class="arbol-si">Ya tiene mensual</div>\n        <div class="arbol-dice">Cliente activo pagando más</div>\n        <div class="arbol-ofrece">→ Convertir a PAC</div>\n        <div class="arbol-extra">Ahorra $5.000/mes automático</div>\n      </div>\n      <div class="arbol-item">\n        <div class="arbol-si">Está indeciso</div>\n        <div class="arbol-dice">No cierra, no sabe</div>\n        <div class="arbol-ofrece">→ Inbody primero</div>\n        <div class="arbol-extra">Después cierra con diagnóstico real</div>\n      </div>\n    </div>\n  </div>\n\n  <!-- SCRIPTS CLAVE -->\n  <div class="section">\n    <div class="section-title">Scripts que tienes que saber de memoria</div>\n    <div class="scripts">\n      <div class="script-item">\n        <div class="script-label">PAC — cómo venderlo sin que suene a cobro</div>\n        <div class="script-text">"Funciona como Netflix — pagas hoy y se renueva solo. No tienes que acordarte de venir a pagar, y sale $5.000 más barato que el mensual. Lo puedes cancelar cuando quieras."</div>\n      </div>\n      <div class="script-item">\n        <div class="script-label">Matrícula — palanca de cierre</div>\n        <div class="script-text">"Si te inscribes hoy te dejo sin matrícula — son $9.990 que te ahorras ahora mismo. Si vuelves otro día la tendrías que pagar igual."</div>\n      </div>\n      <div class="script-item">\n        <div class="script-label">Creatina — primer suplemento siempre</div>\n        <div class="script-text">"La creatina es el suplemento con más evidencia científica. La 4Active de 600gr dura 4 meses a menos de $300 al día. ¿Te la muestro?"</div>\n      </div>\n      <div class="script-item">\n        <div class="script-label">Inbody — para indecisos</div>\n        <div class="script-text">"Hagamos una medición rápida — 5 minutos y te dice exactamente cuánta grasa y músculo tienes. Así el plan que elijas tiene sentido real para tu cuerpo."</div>\n      </div>\n    </div>\n  </div>\n\n  <!-- SUPLEMENTOS -->\n  <div class="section">\n    <div class="section-title">Diagnóstico de suplementos — qué ofrecer según perfil</div>\n    <div class="supl-grid">\n      <div class="supl-item">\n        <div class="supl-perfil">Principiante</div>\n        <div class="supl-prod">Creatina 4Active 600gr</div>\n        <div class="supl-comp">+ Pure Whey 900gr</div>\n      </div>\n      <div class="supl-item">\n        <div class="supl-perfil">Ganar músculo</div>\n        <div class="supl-prod">Creatina 1kg + Dragon Pharma</div>\n        <div class="supl-comp">+ Glutamina si 5+ días</div>\n      </div>\n      <div class="supl-item">\n        <div class="supl-perfil">Bajar de peso</div>\n        <div class="supl-prod">Pure Whey + Cafeína caps</div>\n        <div class="supl-comp">+ HCA si ansiedad por comida</div>\n      </div>\n      <div class="supl-item">\n        <div class="supl-perfil">Sin energía</div>\n        <div class="supl-prod">Cafeína caps</div>\n        <div class="supl-comp">+ Hyde si ya toma cafeína</div>\n      </div>\n      <div class="supl-item">\n        <div class="supl-perfil">Mayor de 50</div>\n        <div class="supl-prod">Creatina + Magnesio</div>\n        <div class="supl-comp">+ Pure Whey si quiere músculo</div>\n      </div>\n      <div class="supl-item">\n        <div class="supl-perfil">Recuperación</div>\n        <div class="supl-prod">Creatina + Glutamina</div>\n        <div class="supl-comp">+ Magnesio si calambres</div>\n      </div>\n    </div>\n  </div>\n\n  <!-- OBJECIONES -->\n  <div class="section">\n    <div class="section-title">Objeciones más comunes</div>\n    <div class="obj-grid">\n      <div class="obj-item">\n        <div class="obj-q">"Lo voy a pensar"</div>\n        <div class="obj-a">→ "Si te inscribes hoy no pagas matrícula — $9.990 que te ahorras ahora."</div>\n      </div>\n      <div class="obj-item">\n        <div class="obj-q">"Está muy caro"</div>\n        <div class="obj-a">→ "Por día son menos de $1.200 — menos que un café, con acceso ilimitado."</div>\n      </div>\n      <div class="obj-item">\n        <div class="obj-q">"No voy a ser constante"</div>\n        <div class="obj-a">→ "El PAC ayuda con eso — no tienes que decidir renovar cada mes."</div>\n      </div>\n      <div class="obj-item">\n        <div class="obj-q">"No me gusta dar mi tarjeta"</div>\n        <div class="obj-a">→ "Funciona como Netflix. Mercado Pago protege todo — noso  line-height: 1.3;\n  }\n  .supl-perfil { color: #2980B9; font-weight: 700; font-size: 8px; text-transform: uppercase; letter-spacing: 0.5px; }\n  .supl-prod { color: #fff; margin-top: 1px; font-weight: 600; }\n  .supl-comp { color: #1D9E75; font-size: 8px; }\n  .supl-no { color: #C0392B; font-size: 8px; }\n\n  /* SERVICIOS PREMIUM */\n  .premium-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2mm; }\n  .premium-item {\n    background: #1A1A1A;\n    border: 1px solid #222;\n    border-top: 2px solid #8E44AD;\n    padding: 5px 7px;\n    font-size: 9px;\n    line-height: 1.4;\n  }\n  .premium-nombre { color: #8E44AD; font-weight: 700; font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; }\n  .premium-cuando { color: #aaa; font-size: 8.5px; margin-top: 1px; }\n  .premium-script { color: #ddd; font-style: italic; font-size: 8.5px; margin-top: 2px; }\n  .premium-com { color: #1D9E75; font-weight: 700; font-size: 8px; margin-top: 2px; }\n\n  /* OBJECIONES */\n  .obj-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5mm; }\n  .obj-item {\n    background: #1A1A1A;\n    border: 1px solid #222;\n    padding: 4px 6px;\n    font-size: 8.5px;\n    line-height: 1.3;\n  }\n  .obj-q { color: #EF9F27; font-style: italic; font-size: 8px; }\n  .obj-a { color: #ccc; font-size: 8px; margin-top: 1px; }\n\n  /* COMISIONES */\n  .com-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5mm; }\n  .com-item {\n    background: #1A1A1A;\n    border: 1px solid #222;\n    padding: 4px 5px;\n    text-align: center;\n    font-size: 8px;\n  }\n  .com-tipo { color: #888; font-size: 7.5px; }\n  .com-monto { font-family: \'Bebas Neue\', sans-serif; font-size: 15px; color: #1D9E75; }\n\n  /* REGLAS */\n  .reglas { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5mm; }\n  .regla { display: flex; gap: 5px; align-items: flex-start; font-size: 9px; line-height: 1.3; color: #ccc; }\n  .regla-num { font-family: \'Bebas Neue\', sans-serif; color: #2980B9; font-size: 13px; min-width: 14px; line-height: 1; }\n\n  .footer {\n    border-top: 1px solid #1A1A1A;\n    padding-top: 2mm;\n    display: flex;\n    justify-content: space-between;\n    font-size: 8px;\n    color: #333;\n  }\n\n  @media print {\n    body { background: #fff; padding: 0; margin: 0; }\n    .page { width: 210mm; min-height: 297mm; margin: 0; }\n  }\n</style>\n</head>\n<body>\n<div class="page">\n\n  <!-- HEADER -->\n  <div class="header">\n    <div>\n      <div class="brand">GYM FACTORY</div>\n      <div style="font-size:9px;color:#555;letter-spacing:2px;text-transform:uppercase">Fitness, el lujo de la nueva era</div>\n    </div>\n    <div class="role-badge">PROFESOR / PT</div>\n  </div>\n\n  <!-- ROL -->\n  <div class="section">\n    <div class="section-title">Tu rol</div>\n    <div class="rol-box">\n      <strong>No vendes planes. Vendes la experiencia.</strong> Tu objetivo durante el recorrido: que el cliente sienta "aquí quiero entrenar" <em>antes</em> de llegar al mesón. Tu credibilidad para suplementos es mayor que la de nadie — úsala diagnosticando, no disparando.\n    </div>\n  </div>\n\n  <!-- TRASPASOS -->\n  <div class="section">\n    <div class="section-title">Los 2 traspasos obligatorios</div>\n    <div class="traspaso-grid">\n      <div class="traspaso-item traspaso-rec">\n        <div class="traspaso-label">📋 Recepción → PT (antes de salir)</div>\n        <div class="traspaso-content">Nombre + objetivo/dolor detectado + señal de compra o duda</div>\n      </div>\n      <div class="traspaso-item traspaso-pt">\n        <div class="traspaso-label">📋 PT → Recepción (al volver)</div>\n        <div class="traspaso-content">Qué le emocionó + qué freno tiene + qué suplemento recomendaste</div>\n      </div>\n    </div>\n  </div>\n\n  <!-- RECORRIDO -->\n  <div class="section">\n    <div class="section-title">Script del recorrido — zona por zona</div>\n    <div class="recorrido">\n      <div class="zona">\n        <div class="zona-nombre">Inicio</div>\n        <div class="zona-script">"Hola [nombre], me contaron que buscas [objetivo]. Déjame mostrarte exactamente lo que te va a ayudar."</div>\n      </div>\n      <div class="zona">\n        <div class="zona-nombre">Máquinas</div>\n        <div class="zona-script">"Las máquinas son de primera línea, nunca vas a tener que esperar. Mancuernas hasta 50 kg."</div>\n      </div>\n      <div class="zona">\n        <div class="zona-nombre">Cardio</div>\n        <div class="zona-script">"Ideal para calentar o los días que quieres trabajar más resistencia. Siempre disponible."</div>\n      </div>\n      <div class="zona">\n        <div class="zona-nombre">Camarines</div>\n        <div class="zona-script">"Ducha, lockers, secador y plancha. Puedes venir del trabajo o irte al trabajo después."</div>\n      </div>\n      <div class="zona">\n        <div class="zona-nombre">Cierre</div>\n        <div class="zona-script">"¿Qué te pareció? Esto es lo que te espera cada vez que vengas. Te acompaño de vuelta."</div>\n      </div>\n    </div>\n  </div>\n\n  <!-- DIAGNOSTICO SUPLEMENTOS -->\n  <div class="section">\n    <div class="section-title">3 preguntas de diagnóstico — suplementos</div>\n    <div class="diag-preguntas">\n      <div class="diag-pregunta">\n        <div class="diag-num">Pregunta 1 — Tiempo entrenando</div>\n        <div class="diag-text">"¿Llevas mucho tiempo entrenando o estás empezando?"</div>\n        <div class="diag-para">→ Define nivel. Principiante = creatina básica. Avanzado = puede necesitar más.</div>\n      </div>\n      <div class="diag-pregunta">\n        <div class="diag-num">Pregunta 2 — Objetivo</div>\n        <div class="diag-text">"¿Buscas ganar músculo, bajar de peso, más energía o recuperarte mejor?"</div>\n        <div class="diag-para">→ Define la línea de productos. No ofrezcas estimulantes a mayores de 50.</div>\n      </div>\n      <div class="diag-pregunta">\n        <div class="diag-num">Pregunta 3 — Consumo actual</div>\n const loadedGuias = {};

function openGuia(key) {
  const g = GUIAS[key];
  if (!g) return;
  const w = window.open('', '_blank');
  if (g.type === 'html') {
    w.document.write(g.data);
    w.document.close();
  } else {
    w.document.write('<html><body style="margin:0;background:#111"><embed src="data:application/pdf;base64,' + g.data + '" width="100%" height="100%" type="application/pdf"/></body></html>');
    w.document.close();
  }
}

function downloadGuia(key) {
  const g = GUIAS[key];
  if (!g) return;
  const a = document.createElement('a');
  if (g.type === 'html') {
    a.href = 'data:text/html;charset=utf-8,' + encodeURIComponent(g.data);
    a.download = g.label + '.html';
  } else {
    a.href = 'data:application/pdf;base64,' + g.data;
    a.download = g.label + '.pdf';
  }
  a.click();
}

function loadGuiaFrame(key, frameId) {
  if (loadedGuias[frameId]) return;
  loadedGuias[frameId] = true;
  const g = GUIAS[key];
  const frame = document.getElementById(frameId);
  if (!frame || !g) return;
  if (g.type === 'html') {
    const doc = frame.contentDocument || frame.contentWindow.document;
    doc.open(); doc.write(g.data); doc.close();
  } else {
    frame.src = 'data:application/pdf;base64,' + g.data;
  }
}

function switchGuiaTab(groupId, idx, keys) {
  const group = document.getElementById(groupId);
  if (!group) return;
  group.querySelectorAll('.guias-tab').forEach((t,i) => t.classList.toggle('active', i===idx));
  group.querySelectorAll('.guias-panel').forEach((p,i) => {
    const wasHidden = !p.classList.contains('active');
    p.classList.toggle('active', i===idx);
    if (i===idx && wasHidden) {
      const frame = p.querySelector('iframe');
      if (frame && frame.dataset.key) loadGuiaFrame(frame.dataset.key, frame.id);
    }
  });
}

function initGuias() {
  // Load first tab of each group
  const firstFrames = document.querySelectorAll('.guias-panel.active iframe[data-key]');
  firstFrames.forEach(f => loadGuiaFrame(f.dataset.key, f.id));
}
