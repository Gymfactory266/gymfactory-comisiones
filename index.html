<script>
const SUPABASE_URL = 'https://plncbeggdlnsqwthzrmw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_YNiL8p5nP1NAfRsk8cgtRQ_9_zlN1Ve';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const SHEET_ID = '1vzB0wssprNnXEHi-Tx3fc_ZfVpkudUsuGOEu_JhnGT4';
const URL_SHEET = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Comisiones`;

const PERSONAS = {
  Massiel: { color: '#378ADD', bg: 'rgba(55,138,221,0.2)', rol: 'Recepcion' },
  Sara:    { color: '#1D9E75', bg: 'rgba(29,158,117,0.2)', rol: 'Recepcion' },
  Camila:  { color: '#EF9F27', bg: 'rgba(239,159,39,0.2)', rol: 'Recepcion' },
  Luis:    { color: '#7F77DD', bg: 'rgba(127,119,221,0.2)', rol: 'Profesor/PT' },
  Diego:   { color: '#D85A30', bg: 'rgba(216,90,48,0.2)', rol: 'Profesor/PT' },
  Javiera: { color: '#D4537E', bg: 'rgba(212,83,126,0.2)', rol: 'Profesor/PT' },
};

const COM_PLANES = {
  pacMensual: 2000, pacEstudiante: 1500,
  semestralTarjeta: 4000, semestralTransf: 6000,
  anualTarjeta: 6000, anualTransf: 8000,
};

const medals = ['🥇','🥈','🥉'];
const fmt = n => '$' + Math.round(n||0).toLocaleString('es-CL');

document.getElementById('hdr-date').textContent = new Date().toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'});

document.getElementById('login-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
document.getElementById('login-email').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');
  
  btn.disabled = true;
  btn.textContent = 'Ingresando...';
  err.style.display = 'none';

  const { error } = await db.auth.signInWithPassword({ email, password: pass });
  
  if (error) {
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Ingresar';
  } else {
    showApp();
  }
}

async function doLogout() {
  await db.auth.signOut();
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-email').value = '';
  document.getElementById('login-pass').value = '';
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  loadData();
}

db.auth.getSession().then(({ data: { session } }) => {
  if (session) showApp();
});

function getV(row, col) {
  try {
    const v = row.c[col]?.v;
    if (v === null || v === undefined) return 0;
    if (typeof v === 'number') return v;
    if (typeof v === 'string' && v !== '-') return parseFloat(v) || 0;
    return 0;
  } catch(e) { return 0; }
}

function getTxt(row, col) {
  try { return row.c[col]?.v || ''; } catch(e) { return ''; }
}

async function loadData() {
  try {
    const res = await fetch(URL_SHEET);
    const text = await res.text();
    const match = text.match(/google\.visualization\.Query\.setResponse\((.*)\)/s);
    if (!match) throw new Error('No se pudo leer la respuesta de Google Sheets');
    const json = JSON.parse(match[1]);
    const rows = json.table.rows;

    const names = ['Massiel','Sara','Camila','Luis','Diego','Javiera'];
    const data = names.map((name, i) => ({
      name,
      com: getV(rows[i], 1),
      pac: rows[i].c[2]?.v === '-' || rows[i].c[2]?.v === null ? '-' : getV(rows[i], 2),
      bonoPac: getV(rows[i], 3),
      bonoSupl: getV(rows[i], 4),
      total: getV(rows[i], 5),
      suplTexto: getTxt(rows[i], 6),
      pacMensual:       getV(rows[i], 7),
      pacEstudiante:    getV(rows[i], 8),
      semestralTarjeta: getV(rows[i], 9),
      semestralTransf:  getV(rows[i], 10),
      anualTarjeta:     getV(rows[i], 11),
      anualTransf:      getV(rows[i], 12),
    }));

    const totalPac = rows[7] ? getV(rows[7], 2) : 0;
    const totalCom = rows[7] ? getV(rows[7], 1) : 0;
    const bonoPacVal = rows[9] ? getV(rows[9], 1) : 0;
    const pacSiguiente = rows[10] ? getTxt(rows[10], 1) : '';
    const bonoSuplVal = rows[11] ? getV(rows[11], 1) : 0;
    const ventasSuplReales = rows[12] ? getV(rows[12], 1) : 0;

    renderDashboard(data, totalCom, totalPac, bonoPacVal, pacSiguiente, bonoSuplVal, ventasSuplReales);
  } catch(e) {
    document.getElementById('main').innerHTML = `<div class="error-box"><strong>Error al cargar datos</strong><br>${e.message}</div>`;
  }
}

function buildDetalle(p) {
  const style = PERSONAS[p.name] || {color:'#888'};
  const planes = [
    { label: 'PAC Mensual',       val: p.pacMensual,       com: COM_PLANES.pacMensual },
    { label: 'PAC Estudiante',    val: p.pacEstudiante,    com: COM_PLANES.pacEstudiante },
    { label: 'Semestral Tarjeta', val: p.semestralTarjeta, com: COM_PLANES.semestralTarjeta },
    { label: 'Semestral Transf.', val: p.semestralTransf,  com: COM_PLANES.semestralTransf },
    { label: 'Anual Tarjeta',     val: p.anualTarjeta,     com: COM_PLANES.anualTarjeta },
    { label: 'Anual Transf.',     val: p.anualTransf,      com: COM_PLANES.anualTransf },
  ].filter(pl => pl.val > 0);

  const planesHtml = planes.length > 0 ? `
    <div class="detalle-titulo">Planes vendidos</div>
    <div class="detalle-grid">
      ${planes.map(pl => `
        <div class="detalle-item">
          <div class="detalle-item-label">${pl.label}</div>
          <div class="detalle-item-val" style="color:${style.color}">${pl.val}</div>
          <div class="detalle-item-com">+${fmt(pl.val * pl.com)}</div>
        </div>
      `).join('')}
    </div>
  ` : '<div style="font-size:0.8rem;color:#555;margin-bottom:12px;">Sin planes vendidos este mes</div>';

  const suplHtml = p.suplTexto ? `
    <div class="detalle-supl">
      <div class="detalle-supl-titulo">Suplementos vendidos</div>
      ${p.suplTexto.split(',').map(s => `<span class="supl-tag">${s.trim()}</span>`).join('')}
    </div>
  ` : '';

  return `
    <div class="detalle-persona" id="detalle-${p.name}">
      ${planesHtml}
      ${suplHtml}
      <div class="detalle-total">
        <div class="detalle-total-label">Total comisiones</div>
        <div class="detalle-total-val">${fmt(p.total)}</div>
      </div>
    </div>`;
}

function toggleDetalle(name) {
  const el = document.getElementById(`detalle-${name}`);
  const chev = document.getElementById(`chev-${name}`);
  if (!el) return;
  el.classList.toggle('open');
  if (chev) chev.classList.toggle('open');
}

function renderDashboard(data, totalCom, totalPac, bonoPac, pacSiguiente, bonoSupl, ventasSupl) {
  const sorted = [...data].sort((a,b) => b.total - a.total);
  const maxCom = Math.max(...data.map(d => d.total), 1);
  const pacPct = Math.min(Math.round(totalPac/70*100), 100);

  document.getElementById('main').innerHTML = `
    <div class="content">
      <div class="metrics">
        <div class="metric"><div class="metric-label">Comisiones equipo</div><div class="metric-val white">${fmt(totalCom)}</div></div>
        <div class="metric"><div class="metric-label">PAC nuevos</div><div class="metric-val amber">${totalPac}</div></div>
        <div class="metric"><div class="metric-label">Bono PAC</div><div class="metric-val ${bonoPac>0?'green':'red'}">${fmt(bonoPac)}</div></div>
        <div class="metric"><div class="metric-label">Bono suplementos</div><div class="metric-val ${bonoSupl>0?'green':'red'}">${fmt(bonoSupl)}</div></div>
      </div>

      <div class="card">
        <div class="card-title">Ranking comisiones · ${new Date().toLocaleDateString('es-CL',{month:'long',year:'numeric'})}</div>
        <p class="hint">Toca una persona para ver el detalle</p>
        ${sorted.map((p, i) => {
          const pct = Math.round(p.total/maxCom*100)||0;
          const style = PERSONAS[p.name] || {color:'#888',bg:'rgba(136,136,136,0.15)',rol:'Equipo'};
          return `
            <div onclick="toggleDetalle('${p.name}')">
              <div class="ranking-row">
                <div class="rank-medal">${p.total>0?(medals[i]||`#${i+1}`):'-'}</div>
                <div class="rank-avatar" style="background:${style.bg};color:${style.color}">${p.name[0]}</div>
                <div class="rank-info">
                  <div class="rank-name">${p.name}</div>
                  <div class="rank-sub">${style.rol}${style.rol === 'Recepcion' && typeof p.pac === 'number' ? ' · '+p.pac+' PAC' : ''}</div>
                </div>
                <div class="rank-bar-wrap"><div class="rank-bar-bg"><div class="rank-bar-fill" style="width:${pct}%;background:${style.color}"></div></div></div>
                <div class="rank-com">${fmt(p.total)}</div>
                <div class="rank-chevron" id="chev-${p.name}">▼</div>
              </div>
              ${buildDetalle(p)}
            </div>`;
        }).join('')}
      </div>

      <div class="card">
        <div class="card-title">Bono PAC del equipo</div>
        <div class="prog-wrap">
          <div class="prog-labels"><span>${totalPac} PAC nuevos</span><span>${pacPct}%</span></div>
          <div class="prog-track"><div class="prog-fill" style="width:${pacPct}%"></div></div>
        </div>
        <div class="bonus-row"><span>50 PAC → bono $20.000</span><span>${totalPac>=50?'<span class="badge badge-ok">Activado</span>':'<span class="badge badge-warn">Faltan '+(50-totalPac)+'</span>'}</span></div>
        <div class="bonus-row"><span>60 PAC → bono $30.000</span><span>${totalPac>=60?'<span class="badge badge-ok">Activado</span>':'<span class="badge badge-no">Faltan '+(60-totalPac)+'</span>'}</span></div>
        <div class="bonus-row"><span>70+ PAC → bono $45.000</span><span>${totalPac>=70?'<span class="badge badge-ok">Activado</span>':'<span class="badge badge-no">Faltan '+(70-totalPac)+'</span>'}</span></div>
        ${bonoPac>0?`<div class="ok-box">Bono PAC activado: ${fmt(bonoPac)} a repartir</div>`:`<div class="alert-box">${pacSiguiente||'Sigan vendiendo PAC para activar el bono'}</div>`}
      </div>

      <div class="card">
        <div class="card-title">Bono suplementos del equipo</div>
        <div class="prog-wrap">
          <div class="prog-labels"><span>${fmt(ventasSupl)} vendidos</span><span>${Math.min(Math.round(ventasSupl/1000000*100),100)}% de $1M</span></div>
          <div class="prog-track"><div class="prog-fill" style="width:${Math.min(ventasSupl/1000000*100,100)}%"></div></div>
        </div>
        <div class="bonus-row"><span>$700k-$850k → $20.000</span><span>${ventasSupl>=700000?'<span class="badge badge-ok">Activado</span>':'<span class="badge badge-no">Pendiente</span>'}</span></div>
        <div class="bonus-row"><span>$850k-$1M → $30.000</span><span>${ventasSupl>=850000?'<span class="badge badge-ok">Activado</span>':'<span class="badge badge-no">Pendiente</span>'}</span></div>
        <div class="bonus-row"><span>Sobre $1M → $40.000</span><span>${ventasSupl>=1000000?'<span class="badge badge-ok">Activado</span>':'<span class="badge badge-no">Pendiente</span>'}</span></div>
        ${bonoSupl>0?`<div class="ok-box">Bono suplementos activado: ${fmt(bonoSupl)}</div>`:`<div class="alert-box">Llevan ${fmt(ventasSupl)} de $700.000 · Faltan ${fmt(Math.max(0,700000-ventasSupl))}</div>`}
      </div>

      <button class="refresh-btn" onclick="refresh()">↻ Actualizar datos</button>
    </div>
    <div class="footer">Gym Factory · Membrillar 266, Rancagua</div>`;
}

function refresh() {
  document.getElementById('main').innerHTML = '<div class="loading"><div class="spinner"></div><p style="color:#666;font-size:0.85rem">Actualizando...</p></div>';
  loadData();
}

setInterval(loadData, 120000);
</script>
