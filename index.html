<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym Factory · Comisiones</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #C0392B;
    --red-dark: #922B21;
    --red-light: #FDECEA;
    --black: #0D0D0D;
    --dark: #1A1A1A;
    --gray: #2C2C2C;
    --light: #F5F5F5;
    --white: #FFFFFF;
    --gold: #F4C430;
    --silver: #C0C0C0;
    --bronze: #CD7F32;
    --green: #1D9E75;
    --amber: #EF9F27;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--black);
    color: var(--white);
    min-height: 100vh;
    padding: 0;
  }

  /* HEADER */
  .header {
    background: var(--red);
    padding: 1.25rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-left h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: 0.05em;
    line-height: 1;
  }
  .header-left p {
    font-size: 0.75rem;
    opacity: 0.8;
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .header-right {
    text-align: right;
    font-size: 0.75rem;
    opacity: 0.8;
  }
  .header-right .date { font-size: 0.85rem; font-weight: 500; }

  /* LOADING */
  .loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    gap: 1rem;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--gray);
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ERROR */
  .error-box {
    background: var(--red-light);
    color: var(--red-dark);
    border-radius: 12px;
    padding: 1.25rem;
    margin: 1.5rem;
    font-size: 0.9rem;
    line-height: 1.6;
  }

  /* CONTENT */
  .content { padding: 1.25rem; max-width: 600px; margin: 0 auto; }

  /* METRICS */
  .metrics {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 1.25rem;
  }
  .metric {
    background: var(--dark);
    border-radius: 12px;
    padding: 1rem;
    border: 1px solid var(--gray);
  }
  .metric-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: #888; margin-bottom: 4px; }
  .metric-val { font-family: 'Bebas Neue', sans-serif; font-size: 1.75rem; letter-spacing: 0.03em; }
  .metric-val.red { color: var(--red); }
  .metric-val.green { color: var(--green); }
  .metric-val.amber { color: var(--amber); }
  .metric-val.white { color: var(--white); }

  /* CARDS */
  .card {
    background: var(--dark);
    border-radius: 16px;
    padding: 1.25rem;
    margin-bottom: 1rem;
    border: 1px solid var(--gray);
  }
  .card-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #666;
    margin-bottom: 1rem;
    font-weight: 600;
  }

  /* RANKING */
  .ranking-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--gray);
    animation: fadeIn 0.4s ease forwards;
    opacity: 0;
  }
  .ranking-row:last-child { border-bottom: none; }
  @keyframes fadeIn { to { opacity: 1; } }
  .rank-medal { font-size: 1.25rem; min-width: 28px; text-align: center; }
  .rank-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem; font-weight: 600; flex-shrink: 0;
    font-family: 'Bebas Neue', sans-serif; font-size: 1rem;
    letter-spacing: 0.05em;
  }
  .rank-info { flex: 1; min-width: 0; }
  .rank-name { font-weight: 600; font-size: 0.95rem; }
  .rank-sub { font-size: 0.72rem; color: #666; margin-top: 1px; }
  .rank-bar-wrap { flex: 1; margin: 0 8px; }
  .rank-bar-bg { background: var(--gray); border-radius: 4px; height: 6px; overflow: hidden; }
  .rank-bar-fill { height: 100%; border-radius: 4px; transition: width 1s ease; width: 0; }
  .rank-com { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 0.03em; color: var(--green); min-width: 75px; text-align: right; }

  /* PROGRESS */
  .prog-wrap { margin-bottom: 1rem; }
  .prog-labels { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 6px; color: #aaa; }
  .prog-track { background: var(--gray); border-radius: 6px; height: 10px; overflow: hidden; }
  .prog-fill { height: 100%; border-radius: 6px; background: var(--red); transition: width 1s ease; width: 0; }

  /* BONUS ROWS */
  .bonus-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--gray); font-size: 0.85rem;
  }
  .bonus-row:last-child { border-bottom: none; }
  .badge {
    font-size: 0.7rem; font-weight: 600; padding: 3px 10px;
    border-radius: 20px; white-space: nowrap;
  }
  .badge-ok { background: rgba(29,158,117,0.2); color: var(--green); }
  .badge-no { background: var(--gray); color: #666; }
  .badge-warn { background: rgba(239,159,39,0.2); color: var(--amber); }

  /* ALERT / OK BOX */
  .alert-box {
    background: rgba(239,159,39,0.1);
    border: 1px solid rgba(239,159,39,0.3);
    border-radius: 10px; padding: 0.75rem 1rem;
    font-size: 0.82rem; color: var(--amber); margin-top: 0.75rem;
    line-height: 1.5;
  }
  .ok-box {
    background: rgba(29,158,117,0.1);
    border: 1px solid rgba(29,158,117,0.3);
    border-radius: 10px; padding: 0.75rem 1rem;
    font-size: 0.82rem; color: var(--green); margin-top: 0.75rem;
    line-height: 1.5;
  }

  /* REFRESH */
  .refresh-btn {
    display: block; width: 100%; margin-top: 1rem;
    background: var(--gray); color: #aaa;
    border: none; border-radius: 12px; padding: 0.875rem;
    font-family: 'DM Sans', sans-serif; font-size: 0.85rem;
    cursor: pointer; text-align: center; letter-spacing: 0.05em;
    text-transform: uppercase; font-weight: 500;
    transition: background 0.2s;
  }
  .refresh-btn:hover { background: #333; color: var(--white); }

  .footer {
    text-align: center; padding: 2rem 1rem 1rem;
    font-size: 0.7rem; color: #444;
    text-transform: uppercase; letter-spacing: 0.1em;
  }

  /* ANIMATE DELAYS */
  .ranking-row:nth-child(1) { animation-delay: 0.1s; }
  .ranking-row:nth-child(2) { animation-delay: 0.2s; }
  .ranking-row:nth-child(3) { animation-delay: 0.3s; }
  .ranking-row:nth-child(4) { animation-delay: 0.4s; }
  .ranking-row:nth-child(5) { animation-delay: 0.5s; }
  .ranking-row:nth-child(6) { animation-delay: 0.6s; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>Gym Factory</h1>
    <p>Control de comisiones</p>
  </div>
  <div class="header-right">
    <div class="date" id="hdr-date"></div>
    <div id="hdr-mes">Mayo 2026</div>
  </div>
</div>

<div id="main">
  <div class="loading">
    <div class="spinner"></div>
    <p style="color:#666;font-size:0.85rem">Cargando datos...</p>
  </div>
</div>

<script>
const SHEET_ID = '1vzB0wssprNnXEHi-Tx3fc_ZfVpkudUsuGOEu_JhnGT4';
const SHEET_NAME = 'Comisiones';
const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;

const PERSONAS = {
  Massiel: { color: '#378ADD', bg: 'rgba(55,138,221,0.15)' },
  Sara:    { color: '#1D9E75', bg: 'rgba(29,158,117,0.15)' },
  Camila:  { color: '#EF9F27', bg: 'rgba(239,159,39,0.15)' },
  Luis:    { color: '#7F77DD', bg: 'rgba(127,119,221,0.15)' },
  Diego:   { color: '#D85A30', bg: 'rgba(216,90,48,0.15)' },
  Javiera: { color: '#D4537E', bg: 'rgba(212,83,126,0.15)' },
};
const medals = ['🥇','🥈','🥉'];
const fmt = n => '$' + Math.round(n||0).toLocaleString('es-CL');

document.getElementById('hdr-date').textContent = new Date().toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'});

async function loadData() {
  try {
    const res = await fetch(URL);
    const text = await res.text();
    const json = JSON.parse(text.replace(/^.*?({.*}).*$/s,'$1'));
    const rows = json.table.rows;

    // Parse data from Comisiones sheet
    // Row 0 = headers (Persona, Comisiones, PAC, Bono pac, Bono Supl, Total)
    // Rows 1-6 = Massiel, Sara, Camila, Luis, Diego, Javiera
    // Row 8 = Total equipo
    // Row 10 = Bono pac value
    // Row 11 = PAC siguiente bono text
    // Row 13 = Bono suplementos

    const getVal = (row, col) => {
      try { return parseFloat(rows[row].c[col]?.v) || 0; } catch(e) { return 0; }
    };
    const getTxt = (row, col) => {
      try { return rows[row].c[col]?.v || ''; } catch(e) { return ''; }
    };

    // Row 0 = headers, rows 1-6 = Massiel/Sara/Camila/Luis/Diego/Javiera
    // Row 8 = Total equipo (index 8)
    // Row 10 = Bono pac (index 10)
    // Row 11 = PAC siguiente bono (index 11)
    // Row 13 = Bono suplementos (index 13) - may not exist, use row 10 structure

    const people = ['Massiel','Sara','Camila','Luis','Diego','Javiera'];
    const data = people.map((name, i) => ({
      name,
      com: getVal(i+1, 1),
      pac: rows[i+1]?.c[2]?.v !== null && rows[i+1]?.c[2]?.v !== undefined && rows[i+1]?.c[2]?.v !== '-' ? getVal(i+1, 2) : '-',
      bonoPac: getVal(i+1, 3),
      bonoSupl: getVal(i+1, 4),
      total: getVal(i+1, 5),
    }));

    const totalEquipoCom = getVal(8, 1);
    const totalPac = getVal(8, 2);
    const bonoPacVal = getVal(10, 1);
    const pacSiguiente = getTxt(11, 1);
    // Bono suplementos is in row 13 (0-indexed)
    const bonoSuplVal = getVal(13, 1);

    renderDashboard(data, totalEquipoCom, totalPac, bonoPacVal, pacSiguiente, bonoSuplVal);

  } catch(e) {
    document.getElementById('main').innerHTML = `
      <div class="error-box">
        <strong>Error al cargar datos</strong><br>
        Verifica que el Sheet esté compartido como "Cualquiera con el link puede ver".<br><br>
        <small>${e.message}</small>
      </div>`;
  }
}

function renderDashboard(data, totalCom, totalPac, bonoPac, pacSiguiente, bonoSupl) {
  const sorted = [...data].sort((a,b) => b.total - a.total);
  const maxCom = Math.max(...data.map(d => d.total), 1);
  const pacPct = Math.min(Math.round(totalPac/70*100), 100);
  const suplPct = Math.min(Math.round(bonoSupl/35000*100), 100);

  document.getElementById('main').innerHTML = `
    <div class="content">

      <div class="metrics">
        <div class="metric">
          <div class="metric-label">Comisiones equipo</div>
          <div class="metric-val white">${fmt(totalCom)}</div>
        </div>
        <div class="metric">
          <div class="metric-label">PAC nuevos</div>
          <div class="metric-val amber">${totalPac}</div>
        </div>
        <div class="metric">
          <div class="metric-label">Bono PAC</div>
          <div class="metric-val ${bonoPac>0?'green':'red'}">${bonoPac>0?fmt(bonoPac):'$0'}</div>
        </div>
        <div class="metric">
          <div class="metric-label">Bono suplementos</div>
          <div class="metric-val ${bonoSupl>0?'green':'red'}">${bonoSupl>0?fmt(bonoSupl):'$0'}</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Ranking comisiones · ${new Date().toLocaleDateString('es-CL',{month:'long',year:'numeric'})}</div>
        ${sorted.map((p, i) => {
          const pct = Math.round(p.total/maxCom*100)||0;
          const style = PERSONAS[p.name] || {color:'#888',bg:'rgba(136,136,136,0.15)'};
          return `
          <div class="ranking-row" style="animation-delay:${(i+1)*0.1}s">
            <div class="rank-medal">${p.total>0?(medals[i]||`#${i+1}`):'-'}</div>
            <div class="rank-avatar" style="background:${style.bg};color:${style.color}">${p.name[0]}</div>
            <div class="rank-info">
              <div class="rank-name">${p.name}</div>
              <div class="rank-sub">${typeof p.pac === 'number' ? p.pac+' PAC' : 'Profesor/PT'}</div>
            </div>
            <div class="rank-bar-wrap">
              <div class="rank-bar-bg">
                <div class="rank-bar-fill" style="background:${style.color}" data-pct="${pct}"></div>
              </div>
            </div>
            <div class="rank-com">${fmt(p.total)}</div>
          </div>`
        }).join('')}
      </div>

      <div class="card">
        <div class="card-title">Bono PAC del equipo</div>
        <div class="prog-wrap">
          <div class="prog-labels">
            <span>${totalPac} PAC nuevos</span>
            <span>${pacPct}%</span>
          </div>
          <div class="prog-track">
            <div class="prog-fill" data-pct="${pacPct}"></div>
          </div>
        </div>
        <div class="bonus-row"><span>50 PAC → bono $20.000</span><span>${totalPac>=50?'<span class="badge badge-ok">Activado</span>':'<span class="badge badge-warn">Faltan '+(50-totalPac)+'</span>'}</span></div>
        <div class="bonus-row"><span>60 PAC → bono $30.000</span><span>${totalPac>=60?'<span class="badge badge-ok">Activado</span>':'<span class="badge badge-no">Faltan '+(60-totalPac)+'</span>'}</span></div>
        <div class="bonus-row"><span>70+ PAC → bono $45.000</span><span>${totalPac>=70?'<span class="badge badge-ok">Activado</span>':'<span class="badge badge-no">Faltan '+(70-totalPac)+'</span>'}</span></div>
        ${bonoPac>0?`<div class="ok-box">Bono PAC activado: ${fmt(bonoPac)} a repartir entre el equipo</div>`:`<div class="alert-box">${pacSiguiente||'Sigan vendiendo PAC para activar el bono'}</div>`}
      </div>

      <div class="card">
        <div class="card-title">Bono suplementos del equipo</div>
        <div class="bonus-row"><span>$541k-$750k → $10.000</span><span id="bs1"></span></div>
        <div class="bonus-row"><span>$750k-$1M → $20.000</span><span id="bs2"></span></div>
        <div class="bonus-row"><span>Sobre $1M → $35.000</span><span id="bs3"></span></div>
        ${bonoSupl>0?`<div class="ok-box">Bono suplementos activado: ${fmt(bonoSupl)}</div>`:`<div class="alert-box">Sigan vendiendo suplementos para superar el baseline de $541.827</div>`}
      </div>

      <button class="refresh-btn" onclick="refresh()">↻ Actualizar datos</button>

    </div>
    <div class="footer">Gym Factory · Membrillar 266, Rancagua</div>
  `;

  // Animate bars after render
  setTimeout(() => {
    document.querySelectorAll('.rank-bar-fill[data-pct]').forEach(el => {
      el.style.width = el.dataset.pct + '%';
    });
    document.querySelectorAll('.prog-fill[data-pct]').forEach(el => {
      el.style.width = el.dataset.pct + '%';
    });
    // Bonus supl badges
    const bs = [
      {id:'bs1', activated: bonoSupl>=10000},
      {id:'bs2', activated: bonoSupl>=20000},
      {id:'bs3', activated: bonoSupl>=35000},
    ];
    bs.forEach(b => {
      const el = document.getElementById(b.id);
      if(el) el.innerHTML = b.activated ? '<span class="badge badge-ok">Activado</span>' : '<span class="badge badge-no">Pendiente</span>';
    });
  }, 100);
}

function refresh() {
  document.getElementById('main').innerHTML = `<div class="loading"><div class="spinner"></div><p style="color:#666;font-size:0.85rem">Actualizando...</p></div>`;
  loadData();
}

loadData();

// Auto refresh every 2 minutes
setInterval(loadData, 120000);
</script>
</body>
</html>
